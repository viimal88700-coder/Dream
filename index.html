<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wake Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* 1. CINEMATIC DOOR SCENE */
    #scene-door {
      background: radial-gradient(circle at center, #1e110c 0%, #060302 80%, #000 100%);
      perspective: 1200px;
    }
    .door-frame {
      width: 220px;
      height: 380px;
      border: 10px solid #23120b;
      border-bottom: none;
      position: relative;
      background: #000;
      box-shadow: 0 10px 60px rgba(0,0,0,0.95);
      perspective: 1400px;
    }
    .door-leaf {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #44281c 0%, #29150e 60%, #150905 100%);
      border: 2px solid #140804;
      transform-origin: left;
      transition: transform 2.8s cubic-bezier(0.12, 0.9, 0.2, 1);
      position: relative;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    }
    .door-panel {
      position: absolute;
      width: 68%;
      height: 36%;
      left: 16%;
      border: 2px solid rgba(0,0,0,0.6);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 2px rgba(255,255,255,0.08);
    }
    .panel-top { top: 9%; }
    .panel-bottom { bottom: 9%; }
    .door-handle {
      position: absolute;
      right: 16px;
      top: 52%;
      width: 26px;
      height: 8px;
      background: linear-gradient(180deg, #ffd700, #b8860b);
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .door-btn-wrap {
      position: absolute;
      bottom: 60px;
      z-index: 80;
    }
    .cinematic-btn {
      padding: 16px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #e53935, #8e0000);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(229, 57, 53, 0.5), inset 0 1px 2px rgba(255,255,255,0.4);
      transition: transform 0.15s;
    }
    .cinematic-btn:active {
      transform: scale(0.95);
    }
    .lens-bloom {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 15%, rgba(255,255,255,0.9) 60%, rgba(255,180,100,0.3) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 2.0s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .lens-bloom.trigger {
      opacity: 1;
    }

    /* 2. CANVASES (KILONOVA & SHARINGAN VOID) */
    #scene-kilonova, #scene-sharingan {
      background: #000;
    }
    .full-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. DIRECT PHONE CHAT UI */
    #scene-phone {
      background: #0d0e12;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .chat-app-bar {
      width: 100%;
      padding: 14px 20px;
      background: #171821;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .user-info h4 {
      margin: 0;
      font-size: 1.05rem;
    }
    .user-info span {
      font-size: 0.8rem;
      color: #00e676;
      font-weight: 500;
    }
    .chat-stream {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .typing-pill {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      height: 18px;
    }
    .msg-bubble {
      max-width: 82%;
      padding: 12px 18px;
      background: #252634;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.98rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .msg-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .voice-bubble {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #1b5e20;
      border-radius: 18px 18px 18px 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(27, 94, 32, 0.45);
      width: 88%;
    }
    .voice-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b5e20;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .waveform {
      display: flex;
      gap: 3.5px;
      align-items: center;
      height: 28px;
      flex: 1;
    }
    .waveform span {
      width: 3.5px;
      height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 4px;
    }
    .playing .waveform span {
      animation: wavePulse 0.45s ease infinite alternate;
    }
    .waveform span:nth-child(2) { animation-delay: 0.08s; }
    .waveform span:nth-child(3) { animation-delay: 0.16s; }
    .waveform span:nth-child(4) { animation-delay: 0.24s; }
    .waveform span:nth-child(5) { animation-delay: 0.32s; }
    .waveform span:nth-child(6) { animation-delay: 0.40s; }
    @keyframes wavePulse {
      from { height: 6px; }
      to { height: 26px; background: #fff; }
    }

    /* 4. GENJUTSU FLASH */
    .genjutsu-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      background: #ff1100;
      transition: opacity 0.1s ease;
    }

    /* 5. PERFECT CENTERED ALARM SCREEN */
    #scene-alarm {
      background: #030303;
      display: none;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 24px;
      width: 100vw;
      height: 100vh;
    }
    #scene-alarm.active {
      display: flex !important;
    }
    .shock-text {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .digital-clock-box {
      width: 85%;
      max-width: 320px;
      background: #0c0c10;
      padding: 28px 20px;
      border-radius: 22px;
      border: 3px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5), inset 0 0 15px rgba(255, 23, 68, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock-time {
      font-family: monospace;
      font-size: clamp(2.5rem, 11vw, 3.8rem);
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.9);
      line-height: 1.1;
    }
    .clock-ampm {
      font-family: monospace;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 800;
      color: #ff1744;
      text-shadow: 0 0 16px rgba(255, 23, 68, 0.9);
      margin-top: 4px;
    }
    .alarm-notice {
      margin-top: 32px;
      font-size: clamp(1.4rem, 6.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      animation: pulseNotice 0.65s ease infinite alternate;
      max-width: 90%;
      line-height: 1.3;
    }
    @keyframes pulseNotice {
      from { transform: scale(1); color: #ff5252; text-shadow: 0 0 12px red; }
      to { transform: scale(1.08); color: #fff; text-shadow: 0 0 35px #ff1744; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: CINEMATIC DOOR -->
  <div id="scene-door" class="scene active">
    <div class="door-frame" id="doorFrame">
      <div class="door-leaf" id="doorLeaf">
        <div class="door-panel panel-top"></div>
        <div class="door-panel panel-bottom"></div>
        <div class="door-handle" id="doorHandle"></div>
      </div>
    </div>
    <div class="door-btn-wrap">
      <button class="cinematic-btn" id="openDoorBtn" onclick="triggerDoor()">OPEN THE DOOR</button>
    </div>
    <div class="lens-bloom" id="lensBloom"></div>
  </div>

  <!-- SCENE 2: ACCURATE NEUTRON STAR MERGER / KILONOVA -->
  <div id="scene-kilonova" class="scene">
    <canvas id="kilonovaCanvas" class="full-canvas"></canvas>
  </div>

  <!-- SCENE 3: DIRECT PHONE CHAT UI -->
  <div id="scene-phone" class="scene">
    <div class="chat-app-bar">
      <div class="avatar">J</div>
      <div class="user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">online</span>
      </div>
    </div>
    <div class="chat-stream" id="chatStream">
      <div class="msg-bubble" id="msg1">Bro where are you?? 💀</div>
      <div class="msg-bubble" id="msg2">Did you forget what day it is today?</div>
      <div class="msg-bubble" id="msg3">Listen to this audio right now! 👇</div>
      <div class="voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="play-btn" id="playBtnIcon">▶</div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.88rem; font-weight:700;" id="voiceStatus">0:04</span>
      </div>
      <div class="typing-pill" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: DEEP INSIDE THE SHARINGAN VOID -->
  <div id="scene-sharingan" class="scene">
    <canvas id="sharinganCanvas" class="full-canvas"></canvas>
    <div class="genjutsu-overlay" id="genjutsuOverlay"></div>
  </div>

  <!-- SCENE 5: PERFECTLY CENTERED ALARM -->
  <div id="scene-alarm" class="scene">
    <div class="shock-text">* GASP * WAKING UP TO REALITY...</div>
    <div class="digital-clock-box">
      <div class="clock-time">07:45</div>
      <div class="clock-ampm">AM</div>
    </div>
    <div class="alarm-notice">TIME FOR COLLEGE</div>
  </div>

  <script>
    // --- 1. PROCEDURAL CINEMATIC AUDIO SYNTHESIZER ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      playDoorOpen() {
        this.init();
        const now = this.ctx.currentTime;

        const latch = this.ctx.createOscillator();
        const latchGain = this.ctx.createGain();
        latch.type = "square";
        latch.frequency.setValueAtTime(260, now);
        latchGain.gain.setValueAtTime(0.35, now);
        latchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        latch.connect(latchGain);
        latchGain.connect(this.ctx.destination);
        latch.start(now);
        latch.stop(now + 0.12);

        const creak = this.ctx.createOscillator();
        const creakGain = this.ctx.createGain();
        creak.type = "sawtooth";
        creak.frequency.setValueAtTime(60, now + 0.1);
        creak.frequency.linearRampToValueAtTime(310, now + 1.2);
        creak.frequency.exponentialRampToValueAtTime(80, now + 2.5);
        creakGain.gain.setValueAtTime(0.28, now + 0.1);
        creakGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        creak.connect(creakGain);
        creakGain.connect(this.ctx.destination);
        creak.start(now + 0.1);
        creak.stop(now + 2.5);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = "sine";
        sub.frequency.setValueAtTime(100, now + 0.2);
        sub.frequency.exponentialRampToValueAtTime(30, now + 2.2);
        subGain.gain.setValueAtTime(0.5, now + 0.2);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        sub.connect(subGain);
        subGain.connect(this.ctx.destination);
        sub.start(now + 0.2);
        sub.stop(now + 2.2);
      },

      playKilonovaAudio() {
        this.init();
        const now = this.ctx.currentTime;

        // Accelerating orbital whine
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(70, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 2.6);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.38, now + 2.6);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.7);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.7);

        // Relativistic Jet eruption boom
        setTimeout(() => {
          const jetNow = this.ctx.currentTime;
          const jetOsc = this.ctx.createOscillator();
          const jetGain = this.ctx.createGain();
          jetOsc.type = "sine";
          jetOsc.frequency.setValueAtTime(160, jetNow);
          jetOsc.frequency.exponentialRampToValueAtTime(24, jetNow + 2.2);
          jetGain.gain.setValueAtTime(0.9, jetNow);
          jetGain.gain.exponentialRampToValueAtTime(0.001, jetNow + 2.2);
          jetOsc.connect(jetGain);
          jetGain.connect(this.ctx.destination);
          jetOsc.start(jetNow);
          jetOsc.stop(jetNow + 2.2);
        }, 2600);
      },

      playNotificationChime() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // --- 1. DOOR TRIGGER ---
    function triggerDoor() {
      AudioEngine.playDoorOpen();
      document.getElementById("openDoorBtn").style.display = "none";
      document.getElementById("doorHandle").style.transform = "rotate(28deg)";

      setTimeout(() => {
        document.getElementById("doorLeaf").style.transform = "rotateY(-110deg)";
      }, 500);

      setTimeout(() => {
        document.getElementById("lensBloom").classList.add("trigger");
      }, 1600);

      setTimeout(() => {
        showScene("scene-kilonova");
        startKilonovaAnimation();
      }, 2900);
    }

    // --- 2. EXACT NEUTRON STAR MERGER & KILONOVA (FROM VIDEO) ---
    let knAnimId;
    function startKilonovaAnimation() {
      AudioEngine.playKilonovaAudio();
      const canvas = document.getElementById("kilonovaCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      let startTime = Date.now();

      // Deep Space Stars
      const bgStars = [];
      for (let i = 0; i < 280; i++) {
        bgStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.8 + 0.2
        });
      }

      // Tidal tail ribbon memory
      const tidalTails = [];

      function drawNeutronStar(x, y, radius) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        // Cyan-white core
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 3.8);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.3, "#e0f7ff");
        grad.addColorStop(0.65, "#00c3ff");
        grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw background stars
        ctx.fillStyle = "#ffffff";
        bgStars.forEach(s => {
          ctx.globalAlpha = s.alpha;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;

        if (elapsed < 2.5) {
          // ==========================================
          // STAGE 1 & 2: INSPIRAL & CYAN TIDAL TAILS
          // ==========================================
          const spiralFactor = Math.pow(elapsed / 2.5, 2.2);
          const orbitR = (1 - spiralFactor) * (Math.min(canvas.width, canvas.height) * 0.32);
          const angle = Math.pow(elapsed, 2.5) * 8.5;

          const s1x = cx + Math.cos(angle) * orbitR;
          const s1y = cy + Math.sin(angle) * (orbitR * 0.7);
          const s2x = cx + Math.cos(angle + Math.PI) * orbitR;
          const s2y = cy + Math.sin(angle + Math.PI) * (orbitR * 0.7);

          tidalTails.push({ x: s1x, y: s1y, alpha: 1.0 });
          tidalTails.push({ x: s2x, y: s2y, alpha: 1.0 });

          // Render streaming cyan tidal tails
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (let i = tidalTails.length - 1; i >= 0; i--) {
            const t = tidalTails[i];
            t.alpha -= 0.035;
            if (t.alpha <= 0) {
              tidalTails.splice(i, 1);
              continue;
            }
            ctx.fillStyle = "rgba(0, 180, 255, " + t.alpha + ")";
            ctx.beginPath();
            ctx.arc(t.x, t.y, 6 + (1 - t.alpha) * 16, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          const rStar = Math.max(12, 26 - elapsed * 4);
          drawNeutronStar(s1x, s1y, rStar);
          drawNeutronStar(s2x, s2y, rStar);

        } else if (elapsed >= 2.5 && elapsed < 3.4) {
          // ==========================================
          // STAGE 3: RELATIVISTIC OPPOSING JETS (45 DEG)
          // ==========================================
          const jetElapsed = elapsed - 2.5;
          const jetLen = jetElapsed * (Math.max(canvas.width, canvas.height) * 1.4);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-Math.PI / 4); // 45-degree angle from the video

          ctx.globalCompositeOperation = "lighter";

          // Expanding equatorial blue synchrotron ring
          const ringR = jetElapsed * 280;
          ctx.strokeStyle = "rgba(70, 150, 255, " + Math.max(0, 0.8 - jetElapsed * 0.6) + ")";
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.ellipse(0, 0, ringR, ringR * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();

          // Fire-orange relativistic jet cores
          for (let dir of [-1, 1]) {
            const jGrad = ctx.createLinearGradient(0, 0, 0, dir * jetLen);
            jGrad.addColorStop(0, "rgba(255, 255, 255, 1)");
            jGrad.addColorStop(0.3, "rgba(255, 140, 0, 0.85)");
            jGrad.addColorStop(0.7, "rgba(255, 50, 0, 0.5)");
            jGrad.addColorStop(1, "rgba(255, 0, 150, 0)");
            ctx.fillStyle = jGrad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-24 - jetElapsed * 20, dir * jetLen);
            ctx.lineTo(24 + jetElapsed * 20, dir * jetLen);
            ctx.closePath();
            ctx.fill();

            // Magenta shock lobes at jet tips
            const lobeY = dir * jetLen;
            const lGrad = ctx.createRadialGradient(0, lobeY, 0, 0, lobeY, 55 + jetElapsed * 30);
            lGrad.addColorStop(0, "#ffffff");
            lGrad.addColorStop(0.4, "#e000ff");
            lGrad.addColorStop(0.8, "#7700ff");
            lGrad.addColorStop(1, "transparent");
            ctx.fillStyle = lGrad;
            ctx.beginPath();
            ctx.arc(0, lobeY, 55 + jetElapsed * 30, 0, Math.PI * 2);
            ctx.fill();
          }

          // Central hyper-dense cyan-white core
          const coreG = ctx.createRadialGradient(0, 0, 0, 0, 0, 65);
          coreG.addColorStop(0, "#ffffff");
          coreG.addColorStop(0.4, "#80e5ff");
          coreG.addColorStop(0.8, "#0077ff");
          coreG.addColorStop(1, "transparent");
          ctx.fillStyle = coreG;
          ctx.beginPath();
          ctx.arc(0, 0, 65, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

        } else {
          // ==========================================
          // STAGE 4: MASSIVE EXPANDING KILONOVA CLOUD
          // ==========================================
          const expElapsed = elapsed - 3.4;
          const cloudR = expElapsed * (Math.max(canvas.width, canvas.height) * 1.6) + 80;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          // Crystalline fractal cloud puff
          const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cloudR);
          cGrad.addColorStop(0, "#ffffff");
          cGrad.addColorStop(0.3, "#a8f0ff");
          cGrad.addColorStop(0.65, "#0099ff");
          cGrad.addColorStop(0.95, "#001144");
          cGrad.addColorStop(1, "transparent");
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, cloudR, 0, Math.PI * 2);
          ctx.fill();

          // Full-screen blinding flash
          ctx.fillStyle = "rgba(255, 255, 255, " + Math.min(1, expElapsed * 2.5) + ")";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        }

        if (elapsed < 4.2) {
          knAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(knAnimId);
          showScene("scene-phone");
          triggerChatMessages();
        }
      }
      loop();
    }

    // --- 3. PHONE CHAT (CLEAN VIEWPORT) ---
    function triggerChatMessages() {
      const delays = [600, 1900, 3200, 4400];
      const elements = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      elements.forEach((id, index) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "typing...";
        }, delays[index] - 450);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "online";
          document.getElementById(id).classList.add("show");
          AudioEngine.playNotificationChime();
        }, delays[index]);
      });
    }

    // --- 4. FRIEND VOICE NOTE (01.mp3) ---
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "❚❚";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "Playing...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 missing/blocked:", e);
        setTimeout(startDeepSharinganVoid, 2000);
      });

      audio1.onended = startDeepSharinganVoid;
    }

    // --- 5. DEEP INSIDE THE EYE: TSUKUYOMI CRIMSON VOID (02.mp3) ---
    let voidAnimId;
    function startDeepSharinganVoid() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3 error:", e));

      const canvas = document.getElementById("sharinganCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      let startTime = Date.now();
      let angle = 0;

      // Ash/ember particles floating in the iris cosmos
      const embers = [];
      for (let i = 0; i < 350; i++) {
        embers.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.8,
          speedY: -(Math.random() * 2 + 0.5),
          alpha: Math.random() * 0.7 + 0.3
        });
      }

      // Mathematical Itachi Curved Tomoe Blade
      function drawItachiBlade(rot, scale) {
        ctx.save();
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(
          scale * 0.28, -scale * 0.35,
          scale * 0.68, -scale * 0.72,
          scale * 0.32, -scale * 0.98
        );
        ctx.bezierCurveTo(
          scale * 0.06, -scale * 0.76,
          -scale * 0.18, -scale * 0.35,
          0, 0
        );
        ctx.fillStyle = "#000000";
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        angle += 0.12 + Math.pow(elapsed, 2) * 0.08;

        // 1. Deep Crimson Cosmic Background (Inside the Iris)
        const voidGrad = ctx.createRadialGradient(cx, cy, 30, cx, cy, Math.max(canvas.width, canvas.height) * 0.8);
        voidGrad.addColorStop(0, "#ff1100");
        voidGrad.addColorStop(0.35, "#aa0000");
        voidGrad.addColorStop(0.7, "#440000");
        voidGrad.addColorStop(1, "#0a0000");
        ctx.fillStyle = voidGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Swirling Iris Striations & Shockwaves
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-angle * 0.3);
        ctx.strokeStyle = "rgba(255, 60, 60, 0.22)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 48; i++) {
          const a = (i * Math.PI) / 24;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40);
          ctx.lineTo(Math.cos(a) * Math.max(canvas.width, canvas.height), Math.sin(a) * Math.max(canvas.width, canvas.height));
          ctx.stroke();
        }
        ctx.restore();

        // 3. Floating Blood Embers
        ctx.fillStyle = "#ff6644";
        embers.forEach(e => {
          e.y += e.speedY;
          if (e.y < 0) e.y = canvas.height;
          ctx.globalAlpha = e.alpha;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 4. Central Pure Black Itachi Mangekyo Blades
        const bladeScale = Math.min(canvas.width, canvas.height) * (0.35 + elapsed * 0.08);

        ctx.save();
        ctx.translate(cx, cy);

        // Aura shockwave around the blades
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 60;

        ctx.save();
        ctx.rotate(angle);
        drawItachiBlade(0, bladeScale);
        drawItachiBlade((Math.PI * 2) / 3, bladeScale);
        drawItachiBlade((Math.PI * 4) / 3, bladeScale);
        ctx.restore();

        // Center pupil abyss
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, bladeScale * 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Rapid Genjutsu Reality Glitch
        if (elapsed > 2.0) {
          document.getElementById("genjutsuOverlay").style.opacity = Math.random() * 0.85;
        }

        if (elapsed < 3.4) {
          voidAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(voidAnimId);
          showScene("scene-alarm");
          triggerWakeUpAlarm();
        }
      }
      loop();
    }

    // --- 6. REALITY WAKEUP & COLLEGE ALARM (03.mp3) ---
    function triggerWakeUpAlarm() {
      const audio3 = new Audio("03.mp3");
      audio3.loop = true;
      audio3.play().catch(e => console.log("03.mp3 error:", e));
    }
  </script>
