<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wake Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* ====================================================
       1. 3D GRAND DOUBLE DOORS WITH BLINDING FLASH (🚪🚪)
       ==================================================== */
    #scene-door {
      background: radial-gradient(circle at center, #1a0d07 0%, #050201 80%, #000 100%);
      perspective: 1400px;
    }
    .portal-arch {
      position: relative;
      width: 320px;
      height: 460px;
      perspective: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arch-frame {
      position: absolute;
      inset: -14px;
      border: 14px solid #1a0c06;
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.98), inset 0 0 35px #000;
      pointer-events: none;
      z-index: 10;
    }
    .doors-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      background: #000;
      overflow: hidden;
      box-shadow: inset 0 0 50px #000;
      position: relative;
    }
    .door-leaf {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #442416 0%, #291209 50%, #140703 100%);
      border: 2px solid #140703;
      position: relative;
      transition: transform 3.0s cubic-bezier(0.12, 0.9, 0.2, 1);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
      z-index: 2;
    }
    .door-left {
      transform-origin: left;
      border-right: 2px solid #090301;
    }
    .door-right {
      transform-origin: right;
      border-left: 2px solid #090301;
    }
    .doors-open .door-left {
      transform: rotateY(-120deg);
    }
    .doors-open .door-right {
      transform: rotateY(120deg);
    }
    .wood-panel {
      position: absolute;
      width: 72%;
      height: 38%;
      left: 14%;
      border: 3px solid rgba(0, 0, 0, 0.7);
      box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.9), 0 0 2px rgba(255, 255, 255, 0.06);
    }
    .panel-top { top: 8%; }
    .panel-bottom { bottom: 8%; }
    .door-knocker {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      border: 4px solid #d4af37;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
    }
    .door-left .door-knocker { right: 14px; }
    .door-right .door-knocker { left: 14px; }

    /* Blinding Volumetric Seam Flare */
    .door-light-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background: #ffffff;
      box-shadow: 0 0 40px 10px #ffffff, 0 0 120px 40px #ffeedd;
      opacity: 0;
      z-index: 1;
      transition: all 1.2s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .doors-open .door-light-beam {
      opacity: 1;
      width: 100%;
      box-shadow: 0 0 150px 80px #ffffff, 0 0 300px 150px #ffeedd;
    }

    .door-btn-wrap {
      position: absolute;
      bottom: 50px;
      z-index: 80;
    }
    .cinematic-btn {
      padding: 16px 44px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #fff;
      background: linear-gradient(135deg, #d32f2f, #7f0000);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(211, 47, 47, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: transform 0.15s;
    }
    .cinematic-btn:active {
      transform: scale(0.96);
    }

    /* Massive Screen Whiteout */
    .blinding-whiteout {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 1.6s cubic-bezier(0.12, 0.9, 0.2, 1);
    }
    .blinding-whiteout.flash-active {
      opacity: 1;
    }

    /* 2. RETINA CANVASES */
    #scene-kilonova, #scene-sharingan, #scene-dizziness, #scene-ghost {
      background: #000;
    }
    .retina-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. PHONE CHAT UI */
    #scene-phone {
      background: #0d0e12;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .chat-app-bar {
      width: 100%;
      padding: 14px 20px;
      background: #171821;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .user-info h4 {
      margin: 0;
      font-size: 1.05rem;
    }
    .user-info span {
      font-size: 0.8rem;
      color: #00e676;
      font-weight: 500;
    }
    .chat-stream {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .typing-pill {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      height: 18px;
    }
    .msg-bubble {
      max-width: 82%;
      padding: 12px 18px;
      background: #252634;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.98rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .msg-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .voice-bubble {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #1b5e20;
      border-radius: 18px 18px 18px 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(27, 94, 32, 0.45);
      width: 88%;
    }
    .voice-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b5e20;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .waveform {
      display: flex;
      gap: 3.5px;
      align-items: center;
      height: 28px;
      flex: 1;
    }
    .waveform span {
      width: 3.5px;
      height: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
    }
    .playing .waveform span {
      animation: wavePulse 0.45s ease infinite alternate;
    }
    .waveform span:nth-child(2) { animation-delay: 0.08s; }
    .waveform span:nth-child(3) { animation-delay: 0.16s; }
    .waveform span:nth-child(4) { animation-delay: 0.24s; }
    .waveform span:nth-child(5) { animation-delay: 0.32s; }
    .waveform span:nth-child(6) { animation-delay: 0.40s; }
    @keyframes wavePulse {
      from { height: 6px; }
      to { height: 26px; background: #fff; }
    }

    /* 4. GENJUTSU FLASH OVERLAY */
    .genjutsu-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      background: #ff1100;
      transition: opacity 0.1s ease;
    }

    /* ====================================================
       5. BED DIZZINESS / VERTIGO WAKE-UP SCENE
       ==================================================== */
    #scene-dizziness {
      background: #08090d;
      perspective: 1000px;
    }
    .dizzy-camera-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.2s ease;
      animation: vertigoSway 3.2s ease-in-out infinite alternate;
    }
    @keyframes vertigoSway {
      0% { transform: scale(1.05) rotate(-4.5deg) translate(-12px, -8px); }
      50% { transform: scale(1.12) rotate(3.8deg) translate(14px, 10px); }
      100% { transform: scale(1.04) rotate(-3.2deg) translate(-10px, 12px); }
    }
    /* Sluggish Blinking Eyelids */
    .eyelid {
      position: absolute;
      left: 0;
      width: 100vw;
      height: 52vh;
      background: #000;
      z-index: 999;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .eyelid-top { top: 0; transform: translateY(0); }
    .eyelid-bottom { bottom: 0; transform: translateY(0); }
    .eyes-open .eyelid-top { transform: translateY(-100%); }
    .eyes-open .eyelid-bottom { transform: translateY(100%); }

    .dizziness-text {
      position: absolute;
      top: 18%;
      font-size: 1.15rem;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      font-style: italic;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      z-index: 50;
      animation: pulseBreath 1.6s ease infinite alternate;
    }
    @keyframes pulseBreath {
      from { opacity: 0.3; transform: scale(0.98); }
      to { opacity: 0.9; transform: scale(1.02); }
    }

    /* ====================================================
       6. ALARM SCREEN
       ==================================================== */
    #scene-alarm {
      background: #030303;
      display: none;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 24px;
      width: 100vw;
      height: 100vh;
    }
    #scene-alarm.active {
      display: flex !important;
    }
    .shock-text {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .digital-clock-box {
      width: 85%;
      max-width: 320px;
      background: #0c0c10;
      padding: 28px 20px;
      border-radius: 22px;
      border: 3px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5), inset 0 0 15px rgba(255, 23, 68, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock-time {
      font-family: monospace;
      font-size: clamp(2.5rem, 11vw, 3.8rem);
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.9);
      line-height: 1.1;
    }
    .clock-ampm {
      font-family: monospace;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 800;
      color: #ff1744;
      text-shadow: 0 0 16px rgba(255, 23, 68, 0.9);
      margin-top: 4px;
    }
    .alarm-notice {
      margin-top: 32px;
      font-size: clamp(1.4rem, 6.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      animation: pulseNotice 0.65s ease infinite alternate;
      max-width: 90%;
      line-height: 1.3;
    }
    @keyframes pulseNotice {
      from { transform: scale(1); color: #ff5252; text-shadow: 0 0 12px red; }
      to { transform: scale(1.08); color: #fff; text-shadow: 0 0 35px #ff1744; }
    }

    /* ====================================================
       7. 4TH-WALL GHOST JUMPSCARE
       ==================================================== */
    #scene-ghost {
      background: #000;
      z-index: 999;
    }
    .cracked-screen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.05s ease;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9) 0px, transparent 2px, transparent 15px);
      mix-blend-mode: color-dodge;
    }
    .earthquake {
      animation: screenRattle 0.06s infinite alternate;
    }
    @keyframes screenRattle {
      0% { transform: translate(-8px, 6px) rotate(-1.5deg); }
      50% { transform: translate(7px, -9px) rotate(1.2deg); }
      100% { transform: translate(-6px, -4px) rotate(-0.8deg); }
    }
    .glitch-flash-intense {
      position: absolute;
      inset: 0;
      background: #ff0033;
      mix-blend-mode: exclusion;
      opacity: 0;
      pointer-events: none;
      z-index: 1001;
    }
    .dimension-text {
      position: absolute;
      bottom: 12%;
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ff0033;
      text-shadow: 0 0 25px red, 0 0 50px black;
      text-transform: uppercase;
      opacity: 0;
      z-index: 1002;
      animation: glitchText 0.15s infinite;
    }
    @keyframes glitchText {
      0% { transform: scale(1) skewX(0deg); }
      50% { transform: scale(1.15) skewX(15deg); color: #fff; }
      100% { transform: scale(0.95) skewX(-15deg); color: #ff0000; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: 3D GRAND DOUBLE DOORS WITH BLINDING FLASH (🚪🚪) -->
  <div id="scene-door" class="scene active">
    <div class="portal-arch" id="portalFrame">
      <div class="arch-frame"></div>
      <div class="doors-wrapper">
        <div class="door-light-beam"></div>
        <div class="door-leaf door-left">
          <div class="wood-panel panel-top"></div>
          <div class="wood-panel panel-bottom"></div>
          <div class="door-knocker"></div>
        </div>
        <div class="door-leaf door-right">
          <div class="wood-panel panel-top"></div>
          <div class="wood-panel panel-bottom"></div>
          <div class="door-knocker"></div>
        </div>
      </div>
    </div>
    <div class="door-btn-wrap">
      <button class="cinematic-btn" id="openDoorBtn" onclick="triggerDoor()">OPEN THE DOORS</button>
    </div>
    <div class="blinding-whiteout" id="blindingFlash"></div>
  </div>

  <!-- SCENE 2: ACCELERATED NEUTRON STAR MERGER & KILONOVA -->
  <div id="scene-kilonova" class="scene">
    <canvas id="kilonovaCanvas" class="retina-canvas"></canvas>
  </div>

  <!-- SCENE 3: DIRECT PHONE CHAT UI -->
  <div id="scene-phone" class="scene">
    <div class="chat-app-bar">
      <div class="avatar">J</div>
      <div class="user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">online</span>
      </div>
    </div>
    <div class="chat-stream" id="chatStream">
      <div class="msg-bubble" id="msg1">Bro where are you?? 💀</div>
      <div class="msg-bubble" id="msg2">Did you forget what day it is today?</div>
      <div class="msg-bubble" id="msg3">Listen to this audio right now! 👇</div>
      <div class="voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="play-btn" id="playBtnIcon">▶</div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.88rem; font-weight:700;" id="voiceStatus">0:04</span>
      </div>
      <div class="typing-pill" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: 3-TOMOE TO ITACHI MANGEKYO TRANSFORMATION -->
  <div id="scene-sharingan" class="scene">
    <canvas id="sharinganCanvas" class="retina-canvas"></canvas>
    <div class="genjutsu-overlay" id="genjutsuOverlay"></div>
  </div>

  <!-- SCENE 5: BED VERTIGO & DIZZINESS POV WAKE-UP -->
  <div id="scene-dizziness" class="scene">
    <div class="eyelid eyelid-top" id="dizzyEyelidTop"></div>
    <div class="eyelid eyelid-bottom" id="dizzyEyelidBottom"></div>
    <div class="dizzy-camera-rig" id="dizzyRig">
      <canvas id="dizzyCanvas" class="retina-canvas"></canvas>
      <div class="dizziness-text">* Head Spinning... Waking Up *</div>
    </div>
  </div>

  <!-- SCENE 6: ALARM SCREEN -->
  <div id="scene-alarm" class="scene">
    <div class="shock-text">* GASP * TIME FOR REALITY...</div>
    <div class="digital-clock-box" id="alarmClockBox">
      <div class="clock-time" id="alarmTimeText">07:45</div>
      <div class="clock-ampm" id="alarmAmPmText">AM</div>
    </div>
    <div class="alarm-notice" id="alarmNoticeText">TIME FOR COLLEGE</div>
  </div>

  <!-- SCENE 7: 4TH-WALL BREAKING GHOST JUMPSCARE -->
  <div id="scene-ghost" class="scene">
    <canvas id="ghostCanvas" class="retina-canvas"></canvas>
    <div class="cracked-screen" id="glassCracks"></div>
    <div class="glitch-flash-intense" id="glitchFlashIntense"></div>
    <div class="dimension-text" id="dimensionText">YOU CANNOT ESCAPE</div>
  </div>

  <script>
    // --- 1. PROCEDURAL CINEMATIC AUDIO & SYNTHESIS ENGINE ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      playDoubleDoorWithBoom() {
        this.init();
        const now = this.ctx.currentTime;

        // Twin latch clicks
        for (let offset of [0, 0.04]) {
          const latch = this.ctx.createOscillator();
          const latchGain = this.ctx.createGain();
          latch.type = "square";
          latch.frequency.setValueAtTime(280, now + offset);
          latch.frequency.exponentialRampToValueAtTime(50, now + offset + 0.14);
          latchGain.gain.setValueAtTime(0.35, now + offset);
          latchGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.14);
          latch.connect(latchGain);
          latchGain.connect(this.ctx.destination);
          latch.start(now + offset);
          latch.stop(now + offset + 0.14);
        }

        // Heavy wood groan
        const creak = this.ctx.createOscillator();
        const creakGain = this.ctx.createGain();
        creak.type = "sawtooth";
        creak.frequency.setValueAtTime(55, now + 0.1);
        creak.frequency.linearRampToValueAtTime(320, now + 1.2);
        creak.frequency.exponentialRampToValueAtTime(75, now + 2.8);
        creakGain.gain.setValueAtTime(0.35, now + 0.1);
        creakGain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
        creak.connect(creakGain);
        creakGain.connect(this.ctx.destination);
        creak.start(now + 0.1);
        creak.stop(now + 2.8);

        // Sub-bass detonation when flash breaches
        setTimeout(() => {
          const flashNow = this.ctx.currentTime;
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = "sine";
          sub.frequency.setValueAtTime(140, flashNow);
          sub.frequency.exponentialRampToValueAtTime(24, flashNow + 2.0);
          subGain.gain.setValueAtTime(0.7, flashNow);
          subGain.gain.exponentialRampToValueAtTime(0.001, flashNow + 2.0);
          sub.connect(subGain);
          subGain.connect(this.ctx.destination);
          sub.start(flashNow);
          sub.stop(flashNow + 2.0);
        }, 1100);
      },

      playAcceleratedKilonova() {
        this.init();
        const now = this.ctx.currentTime;

        // Long escalating gravitational frequency chirp (accelerates into high pitch)
        const chirp = this.ctx.createOscillator();
        const chirpGain = this.ctx.createGain();
        chirp.type = "sawtooth";
        chirp.frequency.setValueAtTime(50, now);
        chirp.frequency.exponentialRampToValueAtTime(1400, now + 4.2);
        chirpGain.gain.setValueAtTime(0.1, now);
        chirpGain.gain.linearRampToValueAtTime(0.45, now + 4.2);
        chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 4.3);
        chirp.connect(chirpGain);
        chirpGain.connect(this.ctx.destination);
        chirp.start(now);
        chirp.stop(now + 4.3);

        // Massive Kilonova explosion detonation
        setTimeout(() => {
          const boomNow = this.ctx.currentTime;
          const boom = this.ctx.createOscillator();
          const boomGain = this.ctx.createGain();
          boom.type = "sine";
          boom.frequency.setValueAtTime(180, boomNow);
          boom.frequency.exponentialRampToValueAtTime(18, boomNow + 2.8);
          boomGain.gain.setValueAtTime(0.95, boomNow);
          boomGain.gain.exponentialRampToValueAtTime(0.001, boomNow + 2.8);
          boom.connect(boomGain);
          boomGain.connect(this.ctx.destination);
          boom.start(boomNow);
          boom.stop(boomNow + 2.8);
        }, 4200);
      },

      playDizzinessHeartbeat() {
        this.init();
        const now = this.ctx.currentTime;
        // Low muffled rhythmic heartbeat
        [0, 0.25, 1.2, 1.45, 2.4, 2.65].forEach(time => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(70, now + time);
          osc.frequency.exponentialRampToValueAtTime(35, now + time + 0.15);
          gain.gain.setValueAtTime(0.5, now + time);
          gain.gain.exponentialRampToValueAtTime(0.001, now + time + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + time);
          osc.stop(now + time + 0.15);
        });
      },

      playNotificationChime() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      },

      playGhostScreech() {
        this.init();
        const now = this.ctx.currentTime;
        [880, 920, 1250, 1820].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.8, now + 0.4);
          osc.frequency.exponentialRampToValueAtTime(60, now + 2.5);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 2.5);
        });
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function setupRetinaCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      return { ctx, width: window.innerWidth, height: window.innerHeight };
    }

    // --- STEP 1: DOUBLE DOORS WITH BLINDING VOLUMETRIC FLASH ---
    function triggerDoor() {
      AudioEngine.playDoubleDoorWithBoom();
      document.getElementById("openDoorBtn").style.display = "none";
      document.getElementById("portalFrame").classList.add("doors-open");

      // Blinding white flash erupts from the opening seam
      setTimeout(() => {
        document.getElementById("blindingFlash").classList.add("flash-active");
      }, 1100);

      setTimeout(() => {
        showScene("scene-kilonova");
        startKilonovaCanvas();
      }, 2400);
    }

    // --- STEP 2: PROLONGED & ULTRA-FAST NEUTRON STAR MERGER ---
    let knAnimId;
    function startKilonovaCanvas() {
      AudioEngine.playAcceleratedKilonova();
      const canvas = document.getElementById("kilonovaCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);

      const cx = width / 2;
      const cy = height / 2;
      let startTime = Date.now();

      const bgStars = [];
      for (let i = 0; i < 380; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.8 + 0.2
        });
      }

      const tidalPlasma = [];

      function drawNeutronCore(x, y, radius) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 3.8);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.25, "#e0f8ff");
        grad.addColorStop(0.65, "#00c8ff");
        grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#ffffff";
        bgStars.forEach(s => {
          ctx.globalAlpha = s.alpha;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;

        // Camera screen shake that intensifies with speed
        let shakeX = 0, shakeY = 0;
        if (elapsed > 2.0 && elapsed < 4.2) {
          const shakeMag = Math.pow((elapsed - 2.0) / 2.2, 2.5) * 16;
          shakeX = (Math.random() - 0.5) * shakeMag;
          shakeY = (Math.random() - 0.5) * shakeMag;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);

        if (elapsed < 4.2) {
          // Prolonged & Exponentially Accelerating Inspiral
          const decay = Math.pow(elapsed / 4.2, 2.8);
          const orbitR = (1 - decay) * (Math.min(width, height) * 0.36);
          // Exponential angular velocity: spins faster and faster
          const theta = Math.pow(elapsed, 3.4) * 4.2;

          const s1x = cx + Math.cos(theta) * orbitR;
          const s1y = cy + Math.sin(theta) * (orbitR * 0.68);
          const s2x = cx + Math.cos(theta + Math.PI) * orbitR;
          const s2y = cy + Math.sin(theta + Math.PI) * (orbitR * 0.68);

          // Eject dense Archimedean tidal plasma
          for (let k = 0; k < 8; k++) {
            const spread = (Math.random() - 0.5) * 14;
            tidalPlasma.push({ x: s1x + spread, y: s1y + spread, alpha: 1.0, color: "#00d5ff" });
            tidalPlasma.push({ x: s2x + spread, y: s2y + spread, alpha: 1.0, color: "#80eeff" });
          }

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (let i = tidalPlasma.length - 1; i >= 0; i--) {
            const p = tidalPlasma[i];
            p.alpha -= 0.034;
            if (p.alpha <= 0) {
              tidalPlasma.splice(i, 1);
              continue;
            }
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4 + (1 - p.alpha) * 20, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          const rCore = Math.max(10, 26 - elapsed * 2.8);
          drawNeutronCore(s1x, s1y, rCore);
          drawNeutronCore(s2x, s2y, rCore);

        } else if (elapsed >= 4.2 && elapsed < 5.2) {
          // Relativistic 45-degree Polar Jets
          const jetT = elapsed - 4.2;
          const jetLength = jetT * (Math.max(width, height) * 1.5);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-Math.PI / 4);

          ctx.globalCompositeOperation = "lighter";

          // Expanding blue synchrotron shock ring
          const ringRadius = jetT * 340;
          ctx.strokeStyle = "rgba(80, 160, 255, " + Math.max(0, 0.85 - jetT * 0.7) + ")";
          ctx.lineWidth = 16;
          ctx.beginPath();
          ctx.ellipse(0, 0, ringRadius, ringRadius * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();

          for (let sign of [-1, 1]) {
            const grad = ctx.createLinearGradient(0, 0, 0, sign * jetLength);
            grad.addColorStop(0, "rgba(255, 255, 255, 1)");
            grad.addColorStop(0.25, "rgba(255, 150, 0, 0.9)");
            grad.addColorStop(0.65, "rgba(255, 40, 0, 0.55)");
            grad.addColorStop(1, "rgba(230, 0, 180, 0)");
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-28 - jetT * 22, sign * jetLength);
            ctx.lineTo(28 + jetT * 22, sign * jetLength);
            ctx.closePath();
            ctx.fill();

            const lobeY = sign * jetLength;
            const lobeGrad = ctx.createRadialGradient(0, lobeY, 0, 0, lobeY, 65 + jetT * 35);
            lobeGrad.addColorStop(0, "#ffffff");
            lobeGrad.addColorStop(0.35, "#e100ff");
            lobeGrad.addColorStop(0.75, "#7700ff");
            lobeGrad.addColorStop(1, "transparent");
            ctx.fillStyle = lobeGrad;
            ctx.beginPath();
            ctx.arc(0, lobeY, 65 + jetT * 35, 0, Math.PI * 2);
            ctx.fill();
          }

          const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 80);
          coreGrad.addColorStop(0, "#ffffff");
          coreGrad.addColorStop(0.35, "#a0f0ff");
          coreGrad.addColorStop(0.75, "#0088ff");
          coreGrad.addColorStop(1, "transparent");
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 80, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

        } else {
          // Massive Expanding Kilonova Cloud
          const expT = elapsed - 5.2;
          const explosionR = expT * (Math.max(width, height) * 1.8) + 90;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, explosionR);
          cGrad.addColorStop(0, "#ffffff");
          cGrad.addColorStop(0.35, "#b5f5ff");
          cGrad.addColorStop(0.7, "#0099ff");
          cGrad.addColorStop(0.95, "#001144");
          cGrad.addColorStop(1, "transparent");
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, explosionR, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255, 255, 255, " + Math.min(1, expT * 2.6) + ")";
          ctx.fillRect(0, 0, width, height);
          ctx.restore();
        }

        ctx.restore();

        if (elapsed < 6.0) {
          knAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(knAnimId);
          showScene("scene-phone");
          triggerChatMessages();
        }
      }
      loop();
    }

    // --- STEP 3: PHONE CHAT ---
    function triggerChatMessages() {
      const delays = [600, 1900, 3200, 4400];
      const elements = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      elements.forEach((id, index) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "typing...";
        }, delays[index] - 450);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "online";
          document.getElementById(id).classList.add("show");
          AudioEngine.playNotificationChime();
        }, delays[index]);
      });
    }

    // --- STEP 4: FRIEND VOICE NOTE (01.mp3) ---
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "❚❚";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "Playing...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 fallback:", e);
        setTimeout(startExactSharinganTransformation, 2000);
      });

      audio1.onended = startExactSharinganTransformation;
    }

    // --- STEP 5: EXACT YOUTUBE SHARINGAN TRANSFORMATION (02.mp3) ---
    let sharinganAnimId;
    function startExactSharinganTransformation() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3 error:", e));

      const canvas = document.getElementById("sharinganCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);

      const cx = width / 2;
      const cy = height / 2;
      let startTime = Date.now();

      // Individual Tomoe Comma (Exact Anime 3-Tomoe Shape)
      function drawStandardTomoe(radius, angle) {
        ctx.save();
        ctx.rotate(angle);
        ctx.translate(0, -radius * 0.52);

        ctx.fillStyle = "#000000";
        // Round head
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.13, 0, Math.PI * 2);
        ctx.fill();

        // Curved tapering tail
        ctx.beginPath();
        ctx.moveTo(radius * 0.12, 0);
        ctx.bezierCurveTo(radius * 0.18, radius * 0.18, radius * 0.08, radius * 0.35, -radius * 0.08, radius * 0.42);
        ctx.bezierCurveTo(-radius * 0.02, radius * 0.28, 0, radius * 0.18, -radius * 0.12, 0);
        ctx.fill();

        ctx.restore();
      }

      // Itachi Mangekyo Curved Tomoe Pinwheel Blade (Fully Formed)
      function drawMangekyoBlade(radius, angle) {
        ctx.save();
        ctx.rotate(angle);
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(radius * 0.26, -radius * 0.32, radius * 0.68, -radius * 0.68, radius * 0.32, -radius * 0.96);
        ctx.bezierCurveTo(radius * 0.06, -radius * 0.74, -radius * 0.18, -radius * 0.35, 0, 0);
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, width, height);

        const rIris = Math.min(width, height) * 0.42;

        ctx.save();
        ctx.translate(cx, cy);

        // 1. Red Iris with Soft Edge Shadow (Matching YouTube Reference)
        const irisGrad = ctx.createRadialGradient(0, 0, rIris * 0.3, 0, 0, rIris);
        irisGrad.addColorStop(0, "#ff0808");
        irisGrad.addColorStop(0.75, "#e60000");
        irisGrad.addColorStop(0.96, "#b30000");
        irisGrad.addColorStop(1, "#000000");
        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(0, 0, rIris, 0, Math.PI * 2);
        ctx.fill();

        // Black Outer Ring / Border
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        // 2. Transformation Calculation
        // Phase 1 (0 to 1.1s): Standard 3-Tomoe
        // Phase 2 (1.1s to 2.4s): Spin accelerates, Tomoe elongate & morph into Mangekyo
        // Phase 3 (2.4s+): Fully formed Mangekyo spinning with Genjutsu blur & zoom
        let spinAngle = 0;
        let morphT = 0; // 0 = 3-tomoe, 1 = Mangekyo

        if (elapsed < 1.1) {
          spinAngle = elapsed * 0.8;
          morphT = 0;
        } else if (elapsed >= 1.1 && elapsed < 2.4) {
          const tNorm = (elapsed - 1.1) / 1.3;
          spinAngle = 0.88 + Math.pow(tNorm, 2.2) * 16.0;
          morphT = tNorm;
        } else {
          spinAngle = 17.0 + (elapsed - 2.4) * 12.0;
          morphT = 1.0;
        }

        // Draw Morphing Tomoe
        ctx.save();
        for (let i = 0; i < 3; i++) {
          const bladeAngle = spinAngle + (i * Math.PI * 2) / 3;

          if (morphT < 0.95) {
            ctx.save();
            ctx.globalAlpha = 1.0 - morphT;
            drawStandardTomoe(rIris, bladeAngle);
            ctx.restore();
          }

          if (morphT > 0.05) {
            ctx.save();
            ctx.globalAlpha = morphT;
            drawMangekyoBlade(rIris, bladeAngle);
            ctx.restore();
          }
        }
        ctx.restore();

        // Center Pupil
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, rIris * 0.16, 0, Math.PI * 2);
        ctx.fill();

        // Subtle specular highlight reflection
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.beginPath();
        ctx.arc(-rIris * 0.28, -rIris * 0.28, rIris * 0.06, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Genjutsu optical reality glitch flash before wake-up
        if (elapsed > 2.8) {
          document.getElementById("genjutsuOverlay").style.opacity = Math.random() * 0.85;
        }

        if (elapsed < 3.8) {
          sharinganAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(sharinganAnimId);
          showScene("scene-dizziness");
          startBedDizzinessWakeUp();
        }
      }
      loop();
    }

    // --- STEP 6: BED VERTIGO & DIZZINESS POV WAKE-UP (BEFORE ALARM) ---
    let dizzyAnimId;
    function startBedDizzinessWakeUp() {
      AudioEngine.playDizzinessHeartbeat();

      const canvas = document.getElementById("dizzyCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);
      const rig = document.getElementById("dizzyRig");

      // Sluggish eyelid blinking (eyes struggle to open)
      setTimeout(() => {
        document.getElementById("scene-dizziness").classList.add("eyes-open");
      }, 500);
      setTimeout(() => {
        document.getElementById("scene-dizziness").classList.remove("eyes-open");
      }, 1400);
      setTimeout(() => {
        document.getElementById("scene-dizziness").classList.add("eyes-open");
      }, 2000);

      let startTime = Date.now();

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        // Draw Bedroom Ceiling & Morning Window Light (First-Person Perspective)
        ctx.fillStyle = "#12141c";
        ctx.fillRect(0, 0, width, height);

        // Ceiling Fan & Shadow
        ctx.save();
        ctx.translate(width / 2, height / 2 - 40);
        ctx.rotate(elapsed * 0.8);
        ctx.fillStyle = "#1c1f2b";
        for (let i = 0; i < 4; i++) {
          ctx.rotate((Math.PI * 2) / 4);
          ctx.fillRect(-14, -140, 28, 140);
        }
        ctx.fillStyle = "#0a0c12";
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Morning Window Light Shaft
        const lightGrad = ctx.createLinearGradient(width, 0, 0, height);
        lightGrad.addColorStop(0, "rgba(255, 230, 180, 0.25)");
        lightGrad.addColorStop(0.5, "rgba(255, 200, 150, 0.08)");
        lightGrad.addColorStop(1, "transparent");
        ctx.fillStyle = lightGrad;
        ctx.fillRect(0, 0, width, height);

        // Chromatic Aberration & Dizziness Vertigo Blur Filter
        const blurAmount = Math.max(0, 10 - elapsed * 2.2);
        rig.style.filter = `blur(${blurAmount}px) hue-rotate(${Math.sin(elapsed * 4) * 25}deg) contrast(1.15)`;

        if (elapsed < 3.8) {
          dizzyAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(dizzyAnimId);
          // Vision suddenly snaps clear into focus on the Alarm Clock!
          showScene("scene-alarm");
          triggerCollegeAlarm();
        }
      }
      loop();
    }

    // --- STEP 7: COLLEGE ALARM (03.mp3) WITH SUDDEN 4TH-WALL GLITCH ---
    let alarmAudio = null;
    function triggerCollegeAlarm() {
      alarmAudio = new Audio("03.mp3");
      alarmAudio.loop = true;
      alarmAudio.play().catch(e => console.log("03.mp3 error:", e));

      // After 3.5 seconds of alarm ringing, trigger the 4th-wall ghost break!
      setTimeout(triggerFourthWallGhostBreak, 3500);
    }

    // --- STEP 8: 4TH-WALL BREAKING GHOST JUMPSCARE ---
    let ghostAnimId;
    function triggerFourthWallGhostBreak() {
      if (alarmAudio) {
        alarmAudio.pause();
        alarmAudio = null;
      }

      const alarmScene = document.getElementById("scene-alarm");
      alarmScene.classList.add("earthquake");
      document.getElementById("alarmTimeText").textContent = "66:66";
      document.getElementById("alarmAmPmText").textContent = "DIE";
      document.getElementById("alarmNoticeText").textContent = "WAKE UP CANNOT HELP YOU";

      AudioEngine.playGhostScreech();

      if ("vibrate" in navigator) {
        navigator.vibrate([200, 80, 400, 100, 800, 100, 1000]);
      }

      setTimeout(() => {
        showScene("scene-ghost");
        document.getElementById("scene-ghost").classList.add("earthquake");
        document.getElementById("glassCracks").style.opacity = "1";
        document.getElementById("dimensionText").style.opacity = "1";

        startGhostRenderEngine();
      }, 700);
    }

    function startGhostRenderEngine() {
      const canvas = document.getElementById("ghostCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);

      const cx = width / 2;
      const cy = height / 2;
      let startTime = Date.now();

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        ctx.fillStyle = "rgba(5, 0, 2, 0.45)";
        ctx.fillRect(0, 0, width, height);

        const imgData = ctx.getImageData(0, 0, width, height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 16) {
          const noise = Math.random() * 255;
          d[i] = noise;
          d[i + 1] = noise * 0.2;
          d[i + 2] = noise * 0.2;
        }
        ctx.putImageData(imgData, 0, 0);

        document.getElementById("glitchFlashIntense").style.opacity = Math.random() > 0.6 ? "0.85" : "0";

        const zoom = Math.min(6.5, 0.8 + Math.pow(elapsed * 2.8, 2.5));

        ctx.save();
        ctx.translate(cx + (Math.random() - 0.5) * 15, cy + (Math.random() - 0.5) * 15);
        ctx.scale(zoom, zoom);

        // Ghost Head
        ctx.fillStyle = "#000000";
        ctx.shadowColor = "#ff0022";
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.ellipse(0, -20, 60, 85, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hollow Void Eyes
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.ellipse(-24, -35, 14, 20, -0.15, 0, Math.PI * 2);
        ctx.ellipse(24, -35, 14, 20, 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(-24, -35, 4, 0, Math.PI * 2);
        ctx.arc(24, -35, 4, 0, Math.PI * 2);
        ctx.fill();

        // Unhinged Screaming Jaw
        ctx.fillStyle = "#000000";
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.ellipse(0, 25, 26, 48 + Math.sin(elapsed * 25) * 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Needle Teeth
        ctx.fillStyle = "#e0e0e0";
        for (let x = -20; x <= 20; x += 5) {
          ctx.beginPath();
          ctx.moveTo(x, -5);
          ctx.lineTo(x + 2.5, 10);
          ctx.lineTo(x + 5, -5);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(x, 55);
          ctx.lineTo(x + 2.5, 40);
          ctx.lineTo(x + 5, 55);
          ctx.fill();
        }

        // Claws
        ctx.strokeStyle = "#111111";
        ctx.lineWidth = 6;
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-75, 40); ctx.lineTo(-110, 10); ctx.lineTo(-135, -20);
        ctx.moveTo(75, 40); ctx.lineTo(110, 10); ctx.lineTo(135, -20);
        ctx.stroke();

        ctx.restore();

        if (elapsed < 3.8) {
          ghostAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(ghostAnimId);
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, width, height);
          document.getElementById("dimensionText").textContent = "REALITY TERMINATED.";
        }
      }
      loop();
    }
