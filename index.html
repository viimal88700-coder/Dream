<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel Dream Genjutsu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: "Courier New", monospace, monospace;
      overflow: hidden;
      color: #fff;
    }

    /* CRT SCANLINE & VIRTUAL RETRO SCREEN OVERLAY */
    .crt-overlay {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.35) 0px,
        rgba(0, 0, 0, 0.35) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 99;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* PIXEL VIRTUAL CANVAS (SCALED UP FOR RAW PIXEL LOOK) */
    .pixel-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* SCENE 1: RETRO PIXEL DOOR UI */
    #scene-door {
      background: #0b0705;
      flex-direction: column;
    }
    .pixel-door-btn {
      position: absolute;
      bottom: 50px;
      padding: 14px 28px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      background: #c62828;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0px #000, 8px 8px 0px #5c0000;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 10;
    }
    .pixel-door-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000;
    }

    /* SCENE 3: RETRO PIXEL PHONE CHAT */
    #scene-phone {
      background: #0f1015;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .pixel-app-bar {
      width: 100%;
      padding: 12px 16px;
      background: #1b1c26;
      border-bottom: 4px solid #000;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pixel-avatar {
      width: 40px;
      height: 40px;
      background: #e53935;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      box-shadow: 3px 3px 0 #000;
    }
    .pixel-user-info h4 {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .pixel-user-info span {
      font-size: 0.75rem;
      color: #00e676;
    }
    .pixel-chat-stream {
      flex: 1;
      width: 100%;
      max-width: 480px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .pixel-msg {
      max-width: 85%;
      padding: 12px 14px;
      background: #252836;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.8);
      font-size: 0.95rem;
      line-height: 1.35;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s step-end, transform 0.25s step-end;
    }
    .pixel-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
    .pixel-voice-bubble {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #1b5e20;
      border: 3px solid #fff;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      opacity: 0;
      width: 88%;
      transition: opacity 0.25s step-end;
    }
    .pixel-voice-bubble.show {
      opacity: 1;
    }
    .pixel-play-btn {
      width: 32px;
      height: 32px;
      background: #fff;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .pixel-wave {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 24px;
      flex: 1;
    }
    .pixel-wave span {
      width: 4px;
      height: 8px;
      background: #fff;
    }
    .playing .pixel-wave span {
      animation: pixelBar 0.4s steps(4) infinite alternate;
    }
    .pixel-wave span:nth-child(2) { animation-delay: 0.1s; }
    .pixel-wave span:nth-child(3) { animation-delay: 0.2s; }
    .pixel-wave span:nth-child(4) { animation-delay: 0.3s; }
    .pixel-wave span:nth-child(5) { animation-delay: 0.4s; }
    @keyframes pixelBar {
      from { height: 6px; }
      to { height: 22px; background: #a5d6a7; }
    }
    .pixel-typing {
      font-size: 0.8rem;
      color: #888;
      height: 16px;
    }

    /* SCENE 5: PIXEL ALARM SCREEN (CLEAN STACKED) */
    #scene-alarm {
      background: #020202;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 24px;
    }
    .pixel-shock-text {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .pixel-clock-box {
      width: 85%;
      max-width: 300px;
      background: #0d0d12;
      padding: 24px 16px;
      border: 4px solid #ff1744;
      box-shadow: 6px 6px 0px #000, 10px 10px 0px #ff1744;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pixel-time {
      font-size: clamp(2.4rem, 10vw, 3.5rem);
      font-weight: 900;
      color: #ff1744;
      letter-spacing: 3px;
    }
    .pixel-ampm {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff1744;
      margin-top: 6px;
    }
    .pixel-alarm-title {
      margin-top: 32px;
      font-size: clamp(1.4rem, 6.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      animation: pixelBlink 0.5s steps(2) infinite;
    }
    @keyframes pixelBlink {
      0% { color: #ff1744; }
      50% { color: #fff; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <!-- SCENE 1: RETRO PIXEL DOOR CANVAS -->
  <div id="scene-door" class="scene active">
    <canvas id="doorCanvas" class="pixel-canvas"></canvas>
    <button class="pixel-door-btn" id="openDoorBtn" onclick="triggerDoor()">[ OPEN DOOR ]</button>
  </div>

  <!-- SCENE 2: RAW PIXEL DITHERED BLACK HOLE -->
  <div id="scene-blackhole" class="scene">
    <canvas id="bhCanvas" class="pixel-canvas"></canvas>
  </div>

  <!-- SCENE 3: PIXEL MESSENGER -->
  <div id="scene-phone" class="scene">
    <div class="pixel-app-bar">
      <div class="pixel-avatar">J</div>
      <div class="pixel-user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">ONLINE</span>
      </div>
    </div>
    <div class="pixel-chat-stream">
      <div class="pixel-msg" id="msg1">Bro where are you?? 💀</div>
      <div class="pixel-msg" id="msg2">Did you forget what day it is today?</div>
      <div class="pixel-msg" id="msg3">Listen to this audio right now! 👇</div>
      <div class="pixel-voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="pixel-play-btn" id="playBtnIcon">▶</div>
        <div class="pixel-wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.85rem; font-weight:900;" id="voiceStatus">01.MP3</span>
      </div>
      <div class="pixel-typing" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: 16-BIT RETRO ITACHI MANGEKYO SHARINGAN -->
  <div id="scene-sharingan" class="scene">
    <canvas id="shCanvas" class="pixel-canvas"></canvas>
  </div>

  <!-- SCENE 5: STACKED PIXEL COLLEGE ALARM -->
  <div id="scene-alarm" class="scene">
    <div class="pixel-shock-text">* Gasp * Reality Check...</div>
    <div class="pixel-clock-box">
      <div class="pixel-time">07:45</div>
      <div class="pixel-ampm">AM</div>
    </div>
    <div class="pixel-alarm-title">TIME FOR COLLEGE</div>
  </div>

  <script>
    // --- 1. PROCEDURAL 8-BIT / 16-BIT SYNTHESIS SOUND ENGINE ---
    const RetroAudio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      playDoorLatch() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(80, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      },
      playNoiseRumble() {
        this.init();
        const now = this.ctx.currentTime;
        // 8-bit periodic wave noise
        const bufLen = this.ctx.sampleRate * 2.5;
        const buf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bufLen; i++) {
          if (Math.random() > 0.85) last = Math.random() * 2 - 1;
          data[i] = last; // Stepped coarse noise
        }
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(now);
        src.stop(now + 2.5);
      },
      playChime() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(783.99, now + 0.08); // G5
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // --- STEP 1: RETRO PIXEL DOOR CANVAS (128x128 INTERNAL RESOLUTION) ---
    const dCanvas = document.getElementById("doorCanvas");
    const dCtx = dCanvas.getContext("2d");
    dCanvas.width = 160;
    dCanvas.height = 160;

    let doorStep = 0;
    function renderPixelDoor() {
      dCtx.fillStyle = "#0b0705";
      dCtx.fillRect(0, 0, 160, 160);

      // Door Frame
      dCtx.fillStyle = "#2d160b";
      dCtx.fillRect(40, 20, 80, 120);

      // Inside Void
      dCtx.fillStyle = "#000";
      dCtx.fillRect(46, 26, 68, 114);

      // Pixelated Opening Door Leaf
      const openWidth = Math.max(0, 68 - doorStep * 8);
      dCtx.fillStyle = "#5d2c1d";
      dCtx.fillRect(46, 26, openWidth, 114);

      // Wood plank pixel dither lines
      dCtx.fillStyle = "#3e1a0e";
      for (let y = 30; y < 140; y += 12) {
        dCtx.fillRect(46, y, openWidth, 2);
      }

      // Brass Knob
      if (openWidth > 12) {
        dCtx.fillStyle = "#ffd54f";
        dCtx.fillRect(46 + openWidth - 8, 80, 4, 6);
      }
    }
    renderPixelDoor();

    function triggerDoor() {
      RetroAudio.playDoorLatch();
      document.getElementById("openDoorBtn").style.display = "none";

      const interval = setInterval(() => {
        doorStep++;
        renderPixelDoor();
        if (doorStep >= 9) {
          clearInterval(interval);
          setTimeout(() => {
            showScene("scene-blackhole");
            startPixelBlackHole();
          }, 300);
        }
      }, 90);
    }

    // --- STEP 2: RAW PIXEL ACCRETION BLACK HOLE (160x160 GRID) ---
    const bhCanvas = document.getElementById("bhCanvas");
    const bhCtx = bhCanvas.getContext("2d");
    bhCanvas.width = 160;
    bhCanvas.height = 160;

    let bhAnim;
    function startPixelBlackHole() {
      RetroAudio.playNoiseRumble();
      const cx = 80;
      const cy = 80;
      const stars = [];

      for (let i = 0; i < 400; i++) {
        stars.push({
          angle: Math.random() * Math.PI * 2,
          r: 10 + Math.random() * 80,
          speed: 0.04 + Math.random() * 0.08,
          fall: 0.5 + Math.random() * 1.5,
          color: Math.random() > 0.4 ? "#ff6d00" : (Math.random() > 0.5 ? "#ffd54f" : "#ffffff")
        });
      }

      let start = Date.now();
      function loop() {
        const elapsed = (Date.now() - start) / 1000;
        let suck = 1.0;
        if (elapsed > 1.6) suck += Math.pow((elapsed - 1.6) * 3, 2);

        bhCtx.fillStyle = "rgba(0, 0, 0, 0.4)";
        bhCtx.fillRect(0, 0, 160, 160);

        // Pixel Accretion Swarm
        stars.forEach(s => {
          s.angle += s.speed * suck;
          s.r -= s.fall * suck;
          if (s.r < 8) {
            s.r = 75 + Math.random() * 10;
            s.angle = Math.random() * Math.PI * 2;
          }

          const px = Math.floor(cx + Math.cos(s.angle) * s.r);
          const py = Math.floor(cy + Math.sin(s.angle) * (s.r * 0.5)); // Tilted pixel disk

          bhCtx.fillStyle = s.color;
          bhCtx.fillRect(px, py, 2, 2); // Discrete chunky pixels
        });

        // 8-Bit Stepped Singularity Core
        bhCtx.fillStyle = "#000000";
        bhCtx.fillRect(72, 74, 16, 12);
        bhCtx.fillRect(74, 72, 12, 16);

        if (elapsed < 3.4) {
          bhAnim = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(bhAnim);
          showScene("scene-phone");
          triggerChat();
        }
      }
      loop();
    }

    // --- STEP 3: PIXEL MESSAGES ---
    function triggerChat() {
      const delays = [600, 1800, 3000, 4200];
      const items = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      items.forEach((id, idx) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "TYPING...";
        }, delays[idx] - 400);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "ONLINE";
          document.getElementById(id).classList.add("show");
          RetroAudio.playChime();
        }, delays[idx]);
      });
    }

    // --- STEP 4: FRIEND VOICE NOTE (01.mp3) ---
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "■";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "PLAYING...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 missing:", e);
        setTimeout(startPixelSharingan, 2000);
      });

      audio1.onended = startPixelSharingan;
    }

    // --- STEP 5: 16-BIT RETRO ITACHI MANGEKYO SHARINGAN (02.mp3) ---
    const shCanvas = document.getElementById("shCanvas");
    const shCtx = shCanvas.getContext("2d");
    shCanvas.width = 160;
    shCanvas.height = 160;

    let shAnim;
    function startPixelSharingan() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3:", e));

      const cx = 80;
      const cy = 80;
      let angle = 0;
      let zoom = 1.0;
      let start = Date.now();

      function drawPixelBlade(rot) {
        shCtx.save();
        shCtx.translate(cx, cy);
        shCtx.rotate(rot);

        // Chunky Stepped Tomoe Geometry (Not smooth vectors)
        shCtx.fillStyle = "#000000";
        shCtx.fillRect(-2, -8, 4, 10);
        shCtx.fillRect(0, -18, 6, 12);
        shCtx.fillRect(4, -28, 8, 12);
        shCtx.fillRect(10, -38, 6, 12);
        shCtx.fillRect(14, -46, 4, 10);
        shCtx.fillRect(10, -50, 4, 6);
        shCtx.fillRect(4, -46, 6, 8);
        shCtx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - start) / 1000;
        angle += 0.12 + elapsed * 0.08;

        if (elapsed > 2.0) {
          zoom += 0.25; // Pixel zoom-dissolve
        }

        shCtx.fillStyle = "#000";
        shCtx.fillRect(0, 0, 160, 160);

        shCtx.save();
        shCtx.translate(cx, cy);
        shCtx.scale(zoom, zoom);
        shCtx.translate(-cx, -cy);

        // 1. Red Pixel Iris Ring
        shCtx.fillStyle = "#b71c1c";
        shCtx.fillRect(cx - 36, cy - 36, 72, 72);
        shCtx.fillStyle = "#d32f2f";
        shCtx.fillRect(cx - 30, cy - 30, 60, 60);

        // 2. 3 Itachi Curved Blades
        drawPixelBlade(angle);
        drawPixelBlade(angle + (Math.PI * 2) / 3);
        drawPixelBlade(angle + (Math.PI * 4) / 3);

        // 3. Center Pixel Pupil
        shCtx.fillStyle = "#000000";
        shCtx.fillRect(cx - 6, cy - 6, 12, 12);

        shCtx.restore();

        // Screen Genjutsu Scanline Glitch
        if (Math.random() > 0.7) {
          shCtx.fillStyle = "rgba(255, 0, 0, 0.4)";
          shCtx.fillRect(0, Math.floor(Math.random() * 160), 160, 4);
        }

        if (elapsed < 3.4) {
          shAnim = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(shAnim);
          showScene("scene-alarm");
          triggerAlarm();
        }
      }
      loop();
    }

    // --- STEP 6: CLEAN VERTICALLY STACKED ALARM (03.mp3) ---
    function triggerAlarm() {
      const audio3 = new Audio("03.mp3");
      audio3.loop = true;
      audio3.play().catch(e => console.log("03.mp3 error:", e));
    }
  </script>
</body>
</html>
