<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wake Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* 1. CINEMATIC DOOR SCENE */
    #scene-door {
      background: radial-gradient(circle at center, #1e110c 0%, #060302 80%, #000 100%);
      perspective: 1200px;
    }
    .door-frame {
      width: 220px;
      height: 380px;
      border: 10px solid #23120b;
      border-bottom: none;
      position: relative;
      background: #000;
      box-shadow: 0 10px 60px rgba(0,0,0,0.95);
      perspective: 1400px;
    }
    .door-leaf {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #44281c 0%, #29150e 60%, #150905 100%);
      border: 2px solid #140804;
      transform-origin: left;
      transition: transform 2.8s cubic-bezier(0.12, 0.9, 0.2, 1);
      position: relative;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    }
    .door-panel {
      position: absolute;
      width: 68%;
      height: 36%;
      left: 16%;
      border: 2px solid rgba(0,0,0,0.6);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 2px rgba(255,255,255,0.08);
    }
    .panel-top { top: 9%; }
    .panel-bottom { bottom: 9%; }
    .door-handle {
      position: absolute;
      right: 16px;
      top: 52%;
      width: 26px;
      height: 8px;
      background: linear-gradient(180deg, #ffd700, #b8860b);
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .door-btn-wrap {
      position: absolute;
      bottom: 60px;
      z-index: 80;
    }
    .cinematic-btn {
      padding: 16px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #e53935, #8e0000);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(229, 57, 53, 0.5), inset 0 1px 2px rgba(255,255,255,0.4);
      transition: transform 0.15s;
    }
    .cinematic-btn:active {
      transform: scale(0.95);
    }
    .lens-bloom {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 15%, rgba(255,255,255,0.9) 60%, rgba(255,180,100,0.3) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 2.0s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .lens-bloom.trigger {
      opacity: 1;
    }

    /* 2. CANVASES */
    #scene-blackhole, #scene-sharingan {
      background: #000;
    }
    .full-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. DIRECT PHONE CHAT UI */
    #scene-phone {
      background: #0d0e12;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .chat-app-bar {
      width: 100%;
      padding: 14px 20px;
      background: #171821;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .user-info h4 {
      margin: 0;
      font-size: 1.05rem;
    }
    .user-info span {
      font-size: 0.8rem;
      color: #00e676;
      font-weight: 500;
    }
    .chat-stream {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .typing-pill {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      height: 18px;
    }
    .msg-bubble {
      max-width: 82%;
      padding: 12px 18px;
      background: #252634;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.98rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .msg-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .voice-bubble {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #1b5e20;
      border-radius: 18px 18px 18px 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(27, 94, 32, 0.45);
      width: 88%;
    }
    .voice-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b5e20;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .waveform {
      display: flex;
      gap: 3.5px;
      align-items: center;
      height: 28px;
      flex: 1;
    }
    .waveform span {
      width: 3.5px;
      height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 4px;
    }
    .playing .waveform span {
      animation: wavePulse 0.45s ease infinite alternate;
    }
    .waveform span:nth-child(2) { animation-delay: 0.08s; }
    .waveform span:nth-child(3) { animation-delay: 0.16s; }
    .waveform span:nth-child(4) { animation-delay: 0.24s; }
    .waveform span:nth-child(5) { animation-delay: 0.32s; }
    .waveform span:nth-child(6) { animation-delay: 0.40s; }
    @keyframes wavePulse {
      from { height: 6px; }
      to { height: 26px; background: #fff; }
    }

    /* 4. GENJUTSU FLASH */
    .genjutsu-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: color-dodge;
      opacity: 0;
      background: #ff1100;
      transition: opacity 0.15s ease;
    }

    /* 5. PERFECT CENTERED ALARM SCREEN */
    #scene-alarm {
      background: #030303;
      display: none;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 24px;
      width: 100vw;
      height: 100vh;
    }
    #scene-alarm.active {
      display: flex !important;
    }
    .shock-text {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .digital-clock-box {
      width: 85%;
      max-width: 320px;
      background: #0c0c10;
      padding: 28px 20px;
      border-radius: 22px;
      border: 3px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5), inset 0 0 15px rgba(255, 23, 68, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock-time {
      font-family: monospace;
      font-size: clamp(2.5rem, 11vw, 3.8rem);
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.9);
      line-height: 1.1;
    }
    .clock-ampm {
      font-family: monospace;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 800;
      color: #ff1744;
      text-shadow: 0 0 16px rgba(255, 23, 68, 0.9);
      margin-top: 4px;
    }
    .alarm-notice {
      margin-top: 32px;
      font-size: clamp(1.4rem, 6.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      animation: pulseNotice 0.65s ease infinite alternate;
      max-width: 90%;
      line-height: 1.3;
    }
    @keyframes pulseNotice {
      from { transform: scale(1); color: #ff5252; text-shadow: 0 0 12px red; }
      to { transform: scale(1.08); color: #fff; text-shadow: 0 0 35px #ff1744; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: CINEMATIC DOOR -->
  <div id="scene-door" class="scene active">
    <div class="door-frame" id="doorFrame">
      <div class="door-leaf" id="doorLeaf">
        <div class="door-panel panel-top"></div>
        <div class="door-panel panel-bottom"></div>
        <div class="door-handle" id="doorHandle"></div>
      </div>
    </div>
    <div class="door-btn-wrap">
      <button class="cinematic-btn" id="openDoorBtn" onclick="triggerDoor()">OPEN THE DOOR</button>
    </div>
    <div class="lens-bloom" id="lensBloom"></div>
  </div>

  <!-- SCENE 2: ACCRETION DISK BLACK HOLE -->
  <div id="scene-blackhole" class="scene">
    <canvas id="blackHoleCanvas" class="full-canvas"></canvas>
  </div>

  <!-- SCENE 3: DIRECT PHONE CHAT UI -->
  <div id="scene-phone" class="scene">
    <div class="chat-app-bar">
      <div class="avatar">J</div>
      <div class="user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">online</span>
      </div>
    </div>
    <div class="chat-stream" id="chatStream">
      <div class="msg-bubble" id="msg1">Bro where are you?? 💀</div>
      <div class="msg-bubble" id="msg2">Did you forget what day it is today?</div>
      <div class="msg-bubble" id="msg3">Listen to this audio right now! 👇</div>
      <div class="voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="play-btn" id="playBtnIcon">▶</div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.88rem; font-weight:700;" id="voiceStatus">0:04</span>
      </div>
      <div class="typing-pill" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: ANIME ITACHI MANGEKYO SHARINGAN -->
  <div id="scene-sharingan" class="scene">
    <canvas id="sharinganCanvas" class="full-canvas"></canvas>
    <div class="genjutsu-overlay" id="genjutsuOverlay"></div>
  </div>

  <!-- SCENE 5: PERFECTLY CENTERED ALARM -->
  <div id="scene-alarm" class="scene">
    <div class="shock-text">* GASP * WAKING UP TO REALITY...</div>
    <div class="digital-clock-box">
      <div class="clock-time">07:45</div>
      <div class="clock-ampm">AM</div>
    </div>
    <div class="alarm-notice">TIME FOR COLLEGE</div>
  </div>

  <script>
    // --- 1. PROCEDURAL AUDIO SYNTHESIZER ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      playDoorOpen() {
        this.init();
        const now = this.ctx.currentTime;

        const latch = this.ctx.createOscillator();
        const latchGain = this.ctx.createGain();
        latch.type = "square";
        latch.frequency.setValueAtTime(260, now);
        latch.frequency.exponentialRampToValueAtTime(60, now + 0.12);
        latchGain.gain.setValueAtTime(0.35, now);
        latchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        latch.connect(latchGain);
        latchGain.connect(this.ctx.destination);
        latch.start(now);
        latch.stop(now + 0.12);

        const creak = this.ctx.createOscillator();
        const creakGain = this.ctx.createGain();
        creak.type = "sawtooth";
        creak.frequency.setValueAtTime(60, now + 0.1);
        creak.frequency.linearRampToValueAtTime(310, now + 1.2);
        creak.frequency.exponentialRampToValueAtTime(80, now + 2.5);
        creakGain.gain.setValueAtTime(0.28, now + 0.1);
        creakGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        creak.connect(creakGain);
        creakGain.connect(this.ctx.destination);
        creak.start(now + 0.1);
        creak.stop(now + 2.5);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = "sine";
        sub.frequency.setValueAtTime(100, now + 0.2);
        sub.frequency.exponentialRampToValueAtTime(30, now + 2.2);
        subGain.gain.setValueAtTime(0.5, now + 0.2);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        sub.connect(subGain);
        subGain.connect(this.ctx.destination);
        sub.start(now + 0.2);
        sub.stop(now + 2.2);
      },

      playBlackHoleVacuum() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 3.8);
        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 3.8);

        const bufLen = this.ctx.sampleRate * 3.5;
        const buf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(750, now);
        filter.frequency.exponentialRampToValueAtTime(70, now + 3.5);

        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.35, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);

        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 3.5);
      },

      playNotificationChime() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // --- STEP 1: DOOR OPEN ---
    function triggerDoor() {
      AudioEngine.playDoorOpen();
      document.getElementById("openDoorBtn").style.display = "none";
      document.getElementById("doorHandle").style.transform = "rotate(28deg)";

      setTimeout(() => {
        document.getElementById("doorLeaf").style.transform = "rotateY(-110deg)";
      }, 500);

      setTimeout(() => {
        document.getElementById("lensBloom").classList.add("trigger");
      }, 1600);

      setTimeout(() => {
        showScene("scene-blackhole");
        startNaturalBlackHole();
      }, 3000);
    }

    // --- STEP 2: ACCRETION DISK BLACK HOLE (NATURAL BLEND) ---
    let bhId;
    function startNaturalBlackHole() {
      AudioEngine.playBlackHoleVacuum();
      const canvas = document.getElementById("blackHoleCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const rHole = Math.min(canvas.width, canvas.height) * 0.16;
      let startTime = Date.now();

      // Continuous thermodynamic particles
      const particles = [];
      for (let i = 0; i < 2800; i++) {
        const radius = rHole * 1.1 + Math.pow(Math.random(), 2.2) * Math.max(canvas.width, canvas.height) * 0.75;
        particles.push({
          angle: Math.random() * Math.PI * 2,
          radius: radius,
          speed: 0.02 + (1 / (radius * 0.08 + 1)) * 0.06,
          fallSpeed: 1.4 + Math.random() * 2.6,
          size: Math.random() * 2.2 + 0.6,
          isHalo: Math.random() > 0.55
        });
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        let suckFactor = 1.0;
        if (elapsed > 1.8) {
          suckFactor += Math.pow((elapsed - 1.8) * 3, 2.2);
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(cx, cy);

        // Core Gravitational Lensing Glow
        const glow = ctx.createRadialGradient(0, 0, rHole * 0.95, 0, 0, rHole * 3.2);
        glow.addColorStop(0, "rgba(0,0,0,1)");
        glow.addColorStop(0.12, "rgba(255, 230, 160, 0.95)");
        glow.addColorStop(0.3, "rgba(255, 120, 20, 0.65)");
        glow.addColorStop(0.65, "rgba(180, 40, 0, 0.25)");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, rHole * 3.2, 0, Math.PI * 2);
        ctx.fill();

        // Particles
        particles.forEach(p => {
          p.angle += p.speed * suckFactor;
          p.radius -= p.fallSpeed * suckFactor;

          if (p.radius <= rHole * 0.98) {
            p.radius = Math.max(canvas.width, canvas.height) * 0.65;
            p.angle = Math.random() * Math.PI * 2;
          }

          // Smooth thermodynamic coloring (Hot white/yellow inner, orange/red outer)
          const normDist = (p.radius - rHole) / (Math.max(canvas.width, canvas.height) * 0.5);
          if (normDist < 0.15) ctx.fillStyle = "#ffffff";
          else if (normDist < 0.35) ctx.fillStyle = "#ffcc33";
          else if (normDist < 0.65) ctx.fillStyle = "#ff5500";
          else ctx.fillStyle = "#b32400";

          let px, py;
          if (p.isHalo) {
            // Upper and lower vertical Einstein rings
            px = Math.cos(p.angle) * p.radius;
            py = Math.sin(p.angle) * (p.radius * 0.32) - (rHole * 0.5);
          } else {
            // Main equatorial accretion plane
            px = Math.cos(p.angle) * p.radius;
            py = Math.sin(p.angle) * (p.radius * 0.26);
          }

          const tailX = px - Math.sin(p.angle) * (p.fallSpeed * suckFactor * 2.2);
          const tailY = py + Math.cos(p.angle) * (p.fallSpeed * suckFactor * 0.7);

          ctx.strokeStyle = ctx.fillStyle;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        });

        // Event Horizon (Solid Pitch Black Singularity)
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, rHole, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        if (elapsed < 3.8) {
          bhId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(bhId);
          showScene("scene-phone");
          triggerChatMessages();
        }
      }
      loop();
    }

    // --- STEP 3: PHONE CHAT (CLEAN VIEWPORT) ---
    function triggerChatMessages() {
      const delays = [600, 1900, 3200, 4400];
      const elements = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      elements.forEach((id, index) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "typing...";
        }, delays[index] - 450);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "online";
          document.getElementById(id).classList.add("show");
          AudioEngine.playNotificationChime();
        }, delays[index]);
      });
    }

    // --- STEP 4: FRIEND VOICE NOTE (01.mp3) ---
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "❚❚";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "Playing...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 fallback:", e);
        setTimeout(startAnimeItachiEye, 2000);
      });

      audio1.onended = startAnimeItachiEye;
    }

    // --- STEP 5: AUTHENTIC ANIME ITACHI MANGEKYO EYE (02.mp3) ---
    let shId;
    function startAnimeItachiEye() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3 playback error:", e));

      const canvas = document.getElementById("sharinganCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      let startTime = Date.now();
      let angle = 0;
      let zoom = 0.55;

      // Authentic Curved Tomoe Blade Geometry (Itachi's Pinwheel)
      function drawItachiTomoe(rot, r) {
        ctx.save();
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        // Hooked curve extending out to the iris perimeter
        ctx.bezierCurveTo(r * 0.22, -r * 0.28, r * 0.55, -r * 0.65, 0, -r * 0.94);
        ctx.bezierCurveTo(-r * 0.28, -r * 0.65, -r * 0.16, -r * 0.28, 0, 0);
        ctx.fillStyle = "#000000";
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        angle += 0.09 + (elapsed * 0.08);

        if (elapsed < 2.0) {
          zoom += (1.35 - zoom) * 0.06;
        } else {
          zoom += Math.pow((elapsed - 2.0) * 4.8, 2.5) * 0.12;
          document.getElementById("genjutsuOverlay").style.opacity = Math.random() * 0.75;
        }

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(zoom, zoom);

        const rIris = 135;

        // 1. Anime Sclera (Eye Slit Shape with Eyelid Shading)
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(-280, 0);
        ctx.quadraticCurveTo(0, -170, 280, 0);
        ctx.quadraticCurveTo(0, 170, -280, 0);
        ctx.fillStyle = "#e5dfda";
        ctx.fill();
        ctx.clip(); // Keep eye elements inside the human eyelid contour

        // Upper Eyelid Deep Anime Shadow
        const lidShadow = ctx.createLinearGradient(0, -170, 0, 0);
        lidShadow.addColorStop(0, "rgba(20, 15, 15, 0.85)");
        lidShadow.addColorStop(1, "transparent");
        ctx.fillStyle = lidShadow;
        ctx.fillRect(-300, -180, 600, 200);

        // Fine Crimson Blood Vessels
        ctx.strokeStyle = "rgba(180, 0, 0, 0.4)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-250, 0); ctx.lineTo(-160, -25);
        ctx.moveTo(-240, 20); ctx.lineTo(-170, 10);
        ctx.moveTo(250, 0); ctx.lineTo(165, 20);
        ctx.stroke();

        // 2. Rich Crimson Iris
        const irisGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, rIris);
        irisGrad.addColorStop(0, "#ff1a1a");
        irisGrad.addColorStop(0.65, "#b30000");
        irisGrad.addColorStop(0.95, "#400000");
        irisGrad.addColorStop(1, "#000000");
        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(0, 0, rIris, 0, Math.PI * 2);
        ctx.fill();

        // Iris Muscle Striations (Anime Detail)
        ctx.strokeStyle = "rgba(255, 70, 70, 0.35)";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 36; i++) {
          const a = (i * Math.PI) / 18;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32);
          ctx.lineTo(Math.cos(a) * rIris, Math.sin(a) * rIris);
          ctx.stroke();
        }

        // Limbal Ring Outline
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        // 3. Itachi 3-Blade Mangekyo Pinwheel
        ctx.save();
        ctx.rotate(angle);
        drawItachiTomoe(0, rIris);
        drawItachiTomoe((Math.PI * 2) / 3, rIris);
        drawItachiTomoe((Math.PI * 4) / 3, rIris);
        ctx.restore();

        // 4. Central Pupil
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        // 5. Specular Glare (Anime Cornea Highlight)
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        ctx.arc(-42, -45, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.beginPath();
        ctx.arc(38, 42, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore(); // Exit Sclera Clip

        // Thick Anime Eyeliner / Eyelashes
        ctx.strokeStyle = "#120a0a";
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(-285, 0);
        ctx.quadraticCurveTo(0, -175, 285, 0);
        ctx.stroke();

        ctx.restore();

        if (elapsed < 3.4) {
          shId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(shId);
          showScene("scene-alarm");
          triggerWakeUpAlarm();
        }
      }
      loop();
    }

    // --- STEP 6: CLEANLY STACKED COLLEGE ALARM (03.mp3) ---
    function triggerWakeUpAlarm() {
      const audio3 = new Audio("03.mp3");
      audio3.loop = true;
      audio3.play().catch(e => console.log("03.mp3 error:", e));
    }
  </script>
