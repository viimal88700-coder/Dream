<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wake Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* 1. CINEMATIC DOOR SCENE */
    #scene-door {
      background: radial-gradient(circle at center, #22130c 0%, #060302 80%, #000 100%);
      perspective: 1200px;
    }
    .door-frame {
      width: 220px;
      height: 380px;
      border: 10px solid #23120b;
      border-bottom: none;
      position: relative;
      background: #000;
      box-shadow: 0 10px 60px rgba(0,0,0,0.95);
      perspective: 1400px;
    }
    .door-leaf {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #44281c 0%, #29150e 60%, #150905 100%);
      border: 2px solid #140804;
      transform-origin: left;
      transition: transform 3.0s cubic-bezier(0.12, 0.9, 0.2, 1);
      position: relative;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    }
    .door-panel {
      position: absolute;
      width: 68%;
      height: 36%;
      left: 16%;
      border: 2px solid rgba(0,0,0,0.6);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 2px rgba(255,255,255,0.08);
    }
    .panel-top { top: 9%; }
    .panel-bottom { bottom: 9%; }
    .door-handle {
      position: absolute;
      right: 16px;
      top: 52%;
      width: 26px;
      height: 8px;
      background: linear-gradient(180deg, #ffd700, #b8860b);
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .door-btn-wrap {
      position: absolute;
      bottom: 60px;
      z-index: 80;
    }
    .cinematic-btn {
      padding: 16px 42px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #e53935, #8e0000);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(229, 57, 53, 0.5), inset 0 1px 2px rgba(255,255,255,0.4);
      transition: transform 0.15s;
    }
    .cinematic-btn:active {
      transform: scale(0.95);
    }
    .lens-bloom {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 15%, rgba(255,255,255,0.85) 60%, rgba(255,180,100,0.3) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 2.2s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .lens-bloom.trigger {
      opacity: 1;
    }

    /* 2. ASTROPHYSICAL CANVAS BLACK HOLE */
    #scene-blackhole {
      background: #000;
    }
    #blackHoleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 3. DIRECT POV FULLSCREEN PHONE UI */
    #scene-phone {
      background: #0d0e12;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .chat-app-bar {
      width: 100%;
      padding: 14px 20px;
      background: #171821;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .user-info h4 {
      margin: 0;
      font-size: 1.05rem;
    }
    .user-info span {
      font-size: 0.8rem;
      color: #00e676;
      font-weight: 500;
    }
    .chat-stream {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .typing-pill {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      height: 18px;
    }
    .msg-bubble {
      max-width: 82%;
      padding: 12px 18px;
      background: #252634;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.98rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .msg-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* UNBLOCKED VOICE NOTE BAR */
    .voice-bubble {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #1b5e20;
      border-radius: 18px 18px 18px 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(27, 94, 32, 0.45);
      width: 88%;
    }
    .voice-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b5e20;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .waveform {
      display: flex;
      gap: 3.5px;
      align-items: center;
      height: 28px;
      flex: 1;
    }
    .waveform span {
      width: 3.5px;
      height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 4px;
    }
    .playing .waveform span {
      animation: wavePulse 0.45s ease infinite alternate;
    }
    .waveform span:nth-child(2) { animation-delay: 0.08s; }
    .waveform span:nth-child(3) { animation-delay: 0.16s; }
    .waveform span:nth-child(4) { animation-delay: 0.24s; }
    .waveform span:nth-child(5) { animation-delay: 0.32s; }
    .waveform span:nth-child(6) { animation-delay: 0.40s; }
    @keyframes wavePulse {
      from { height: 6px; }
      to { height: 26px; background: #fff; }
    }

    /* 4. CANVAS MANGEKYO SHARINGAN */
    #scene-sharingan {
      background: #000;
    }
    #sharinganCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .glitch-flash {
      position: absolute;
      inset: 0;
      background: red;
      mix-blend-mode: color-dodge;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    /* 5. GASPING WAKE-UP & ALARM */
    #scene-alarm {
      background: #040404;
      text-align: center;
    }
    .eyelid {
      position: absolute;
      left: 0;
      width: 100vw;
      height: 52vh;
      background: #000;
      z-index: 999;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .eyelid-top { top: 0; transform: translateY(0); }
    .eyelid-bottom { bottom: 0; transform: translateY(0); }
    .eyes-open .eyelid-top { transform: translateY(-100%); }
    .eyes-open .eyelid-bottom { transform: translateY(100%); }

    .shock-text {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 24px;
    }
    .digital-clock {
      background: #0d0d12;
      padding: 26px 44px;
      border-radius: 20px;
      border: 3px solid #ff1744;
      box-shadow: 0 0 45px rgba(255, 23, 68, 0.45);
      display: inline-block;
    }
    .clock-time {
      font-family: monospace;
      font-size: 3.8rem;
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 20px rgba(255, 23, 68, 1);
    }
    .alarm-notice {
      margin-top: 24px;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      animation: pulseAlert 0.6s ease infinite alternate;
    }
    @keyframes pulseAlert {
      from { transform: scale(1); color: #ff5252; text-shadow: 0 0 10px red; }
      to { transform: scale(1.1); color: #fff; text-shadow: 0 0 35px #ff1744; }
    }
  </style>
</head>
<body>

  <div class="eyelid eyelid-top" id="eyelidTop"></div>
  <div class="eyelid eyelid-bottom" id="eyelidBottom"></div>

  <!-- SCENE 1: CINEMATIC DOOR -->
  <div id="scene-door" class="scene active">
    <div class="door-frame" id="doorFrame">
      <div class="door-leaf" id="doorLeaf">
        <div class="door-panel panel-top"></div>
        <div class="door-panel panel-bottom"></div>
        <div class="door-handle" id="doorHandle"></div>
      </div>
    </div>
    <div class="door-btn-wrap">
      <button class="cinematic-btn" id="openDoorBtn" onclick="triggerDoor()">OPEN THE DOOR</button>
    </div>
    <div class="lens-bloom" id="lensBloom"></div>
  </div>

  <!-- SCENE 2: CANVAS BLACK HOLE SIMULATION -->
  <div id="scene-blackhole" class="scene">
    <canvas id="blackHoleCanvas"></canvas>
  </div>

  <!-- SCENE 3: DIRECT FULLSCREEN PHONE CHAT -->
  <div id="scene-phone" class="scene">
    <div class="chat-app-bar">
      <div class="avatar">J</div>
      <div class="user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">online</span>
      </div>
    </div>
    <div class="chat-stream" id="chatStream">
      <div class="msg-bubble" id="msg1">Bro where are you?? 💀</div>
      <div class="msg-bubble" id="msg2">Did you forget what day it is today?</div>
      <div class="msg-bubble" id="msg3">Listen to this audio right now! 👇</div>
      <div class="voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="play-btn" id="playBtnIcon">▶</div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.88rem; font-weight:700;" id="voiceStatus">0:04</span>
      </div>
      <div class="typing-pill" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: CANVAS ITACHI MANGEKYO SHARINGAN -->
  <div id="scene-sharingan" class="scene">
    <canvas id="sharinganCanvas"></canvas>
    <div class="glitch-flash" id="genjutsuGlitch"></div>
  </div>

  <!-- SCENE 5: REALITY WAKEUP & COLLEGE ALARM -->
  <div id="scene-alarm" class="scene">
    <div class="shock-text">* GASP * WAKING UP TO REALITY...</div>
    <div class="digital-clock">
      <div class="clock-time">07:45 AM</div>
    </div>
    <div class="alarm-notice">TIME FOR COLLEGE</div>
  </div>

  <script>
    // --- SYNTHESIZED PROCEDURAL AUDIO ENGINE ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },
      playDoorCreak() {
        this.init();
        const now = this.ctx.currentTime;

        const latch = this.ctx.createOscillator();
        const latchGain = this.ctx.createGain();
        latch.type = "triangle";
        latch.frequency.setValueAtTime(320, now);
        latch.frequency.exponentialRampToValueAtTime(70, now + 0.12);
        latchGain.gain.setValueAtTime(0.4, now);
        latchGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        latch.connect(latchGain);
        latchGain.connect(this.ctx.destination);
        latch.start(now);
        latch.stop(now + 0.12);

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(55, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(360, now + 2.5);
        gain.gain.setValueAtTime(0.3, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + 0.15);
        osc.stop(now + 2.5);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = "sine";
        sub.frequency.setValueAtTime(110, now + 0.3);
        sub.frequency.exponentialRampToValueAtTime(26, now + 2.4);
        subGain.gain.setValueAtTime(0.45, now + 0.3);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
        sub.connect(subGain);
        subGain.connect(this.ctx.destination);
        sub.start(now + 0.3);
        sub.stop(now + 2.4);
      },

      playGravitationalSuck() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 3.2);
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 3.2);
      },

      playMessagePing() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(960, now + 0.13);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => document.body.classList.add("eyes-open"), 300);
    });

    // 1. DOOR TRANSITION
    function triggerDoor() {
      AudioEngine.playDoorCreak();
      document.getElementById("openDoorBtn").style.display = "none";
      document.getElementById("doorHandle").style.transform = "rotate(28deg)";

      setTimeout(() => {
        document.getElementById("doorLeaf").style.transform = "rotateY(-110deg)";
      }, 500);

      setTimeout(() => {
        document.getElementById("lensBloom").classList.add("trigger");
      }, 1600);

      setTimeout(() => {
        showScene("scene-blackhole");
        startBlackHoleCanvas();
      }, 3000);
    }

    // 2. TRUE ACCRETION-DISK BLACK HOLE CANVAS (2,500 PARTICLES + SPAGHETTIFICATION)
    let bhAnimId;
    function startBlackHoleCanvas() {
      AudioEngine.playGravitationalSuck();
      const canvas = document.getElementById("blackHoleCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const particles = [];
      const count = 2500;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.pow(Math.random(), 1.5) * Math.max(canvas.width, canvas.height);
        particles.push({
          angle: angle,
          dist: dist,
          speed: (0.015 + Math.random() * 0.035),
          fallSpeed: (1.2 + Math.random() * 2.8),
          size: Math.random() * 2.4 + 0.8,
          // Relativistic brightness: Doppler shifts on the left side
          hue: Math.random() > 0.3 ? 20 + Math.random() * 25 : 55
        });
      }

      let startTime = Date.now();

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        let suckMult = 1.0;
        if (elapsed > 1.8) {
          suckMult += Math.pow((elapsed - 1.8) * 2.5, 2);
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Accretion disk ambient glow
        const glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 180);
        glow.addColorStop(0, "rgba(0,0,0,1)");
        glow.addColorStop(0.3, "rgba(255, 60, 0, 0.5)");
        glow.addColorStop(0.7, "rgba(255, 140, 0, 0.2)");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, 180, 0, Math.PI * 2);
        ctx.fill();

        // Particles
        particles.forEach(p => {
          p.angle += p.speed * suckMult;
          p.dist -= p.fallSpeed * suckMult;

          if (p.dist <= 25) {
            p.dist = Math.max(canvas.width, canvas.height) * 0.8;
            p.angle = Math.random() * Math.PI * 2;
          }

          const px = cx + Math.cos(p.angle) * p.dist;
          const py = cy + Math.sin(p.angle) * p.dist * 0.75; // Elliptical disk tilt

          // Spaghettification streak effect
          const tailLen = (p.fallSpeed * suckMult * 1.5);
          const px2 = cx + Math.cos(p.angle - 0.05) * (p.dist + tailLen);
          const py2 = cy + Math.sin(p.angle - 0.05) * (p.dist + tailLen) * 0.75;

          ctx.strokeStyle = `hsl(${p.hue}, 100%, ${Math.min(90, 50 + suckMult * 10)}%)`;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px2, py2);
          ctx.stroke();
        });

        // Event Horizon (Singularity shadow)
        ctx.fillStyle = "#000000";
        ctx.shadowColor = "#ff3b00";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (elapsed < 3.8) {
          bhAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(bhAnimId);
          showScene("scene-phone");
          triggerChatMessages();
        }
      }
      loop();
    }

    // 3. CHAT SEQUENCE (UNBLOCKED FULLSCREEN)
    function triggerChatMessages() {
      const delays = [600, 1900, 3200, 4400];
      const elements = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      elements.forEach((id, index) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "typing...";
        }, delays[index] - 450);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "online";
          document.getElementById(id).classList.add("show");
          AudioEngine.playMessagePing();
        }, delays[index]);
      });
    }

    // 4. FRIEND VOICE NOTE (01.mp3)
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "❚❚";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "Playing...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 playback failed:", e);
        setTimeout(startSharinganCanvas, 2000);
      });

      audio1.onended = startSharinganCanvas;
    }

    // 5. TRUE CANVAS MANGEKYO SHARINGAN (02.mp3)
    let shAnimId;
    function startSharinganCanvas() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3 playback failed:", e));

      const canvas = document.getElementById("sharinganCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      let rotation = 0;
      let scale = 0.2;
      let startTime = Date.now();

      function drawBlade(angle) {
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        // Itachi's curved pinwheel tomoe geometry
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(24, -30, 48, -70, 0, -110);
        ctx.bezierCurveTo(-28, -70, -12, -30, 0, 0);
        ctx.fillStyle = "#000000";
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        rotation += 0.08 + (elapsed * 0.05);

        if (elapsed < 2.0) {
          scale += (1.4 - scale) * 0.05;
        } else {
          scale += Math.pow((elapsed - 2.0) * 4, 2.2) * 0.08; // Extreme zoom into the eye
          document.getElementById("genjutsuGlitch").style.opacity = Math.random() * 0.7;
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // Crimson iris
        const iris = ctx.createRadialGradient(0, 0, 30, 0, 0, 140);
        iris.addColorStop(0, "#ff1a1a");
        iris.addColorStop(0.7, "#cc0000");
        iris.addColorStop(1, "#4a0000");
        ctx.fillStyle = iris;
        ctx.beginPath();
        ctx.arc(0, 0, 140, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        // 3 Tomoe Blades
        ctx.save();
        ctx.rotate(rotation);
        drawBlade(0);
        drawBlade((Math.PI * 2) / 3);
        drawBlade((Math.PI * 4) / 3);
        ctx.restore();

        // Center pupil
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        if (elapsed < 3.4) {
          shAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(shAnimId);
          showScene("scene-alarm");
          triggerWakeUpAlarm();
        }
      }
      loop();
    }

    // 6. REALITY WAKEUP & COLLEGE ALARM (03.mp3)
    function triggerWakeUpAlarm() {
      document.body.classList.remove("eyes-open");
      setTimeout(() => document.body.classList.add("eyes-open"), 350);

      const audio3 = new Audio("03.mp3");
      audio3.loop = true;
      audio3.play().catch(e => console.log("03.mp3 playback failed:", e));
    }
  </script>
