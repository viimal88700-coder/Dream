<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wake Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scene.active {
      display: flex;
    }

    /* ====================================================
       1. 3D GRAND DOUBLE WOODEN DOORS (🚪🚪)
       ==================================================== */
    #scene-door {
      background: radial-gradient(circle at center, #1a0d07 0%, #050201 80%, #000 100%);
      perspective: 1400px;
    }
    .portal-arch {
      position: relative;
      width: 320px;
      height: 450px;
      perspective: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arch-frame {
      position: absolute;
      inset: -14px;
      border: 14px solid #1a0c06;
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 0 60px rgba(0,0,0,0.95), inset 0 0 35px #000;
      pointer-events: none;
      z-index: 10;
    }
    .doors-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      background: #000;
      overflow: hidden;
      box-shadow: inset 0 0 50px #000;
    }
    .door-leaf {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #442416 0%, #291209 50%, #140703 100%);
      border: 2px solid #140703;
      position: relative;
      transition: transform 3.2s cubic-bezier(0.12, 0.9, 0.2, 1);
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    }
    .door-left {
      transform-origin: left;
      border-right: 2px solid #090301;
    }
    .door-right {
      transform-origin: right;
      border-left: 2px solid #090301;
    }
    .doors-open .door-left {
      transform: rotateY(-118deg);
    }
    .doors-open .door-right {
      transform: rotateY(118deg);
    }
    .wood-panel {
      position: absolute;
      width: 72%;
      height: 38%;
      left: 14%;
      border: 3px solid rgba(0,0,0,0.7);
      box-shadow: inset 0 0 16px rgba(0,0,0,0.9), 0 0 2px rgba(255,255,255,0.06);
    }
    .panel-top { top: 8%; }
    .panel-bottom { bottom: 8%; }
    .door-knocker {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      border: 4px solid #d4af37;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.9);
    }
    .door-left .door-knocker { right: 14px; }
    .door-right .door-knocker { left: 14px; }

    .door-btn-wrap {
      position: absolute;
      bottom: 50px;
      z-index: 80;
    }
    .cinematic-btn {
      padding: 16px 44px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #fff;
      background: linear-gradient(135deg, #d32f2f, #7f0000);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(211, 47, 47, 0.55), inset 0 1px 2px rgba(255,255,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .cinematic-btn:active {
      transform: scale(0.96);
    }
    .lens-bloom {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 15%, rgba(255,255,255,0.9) 60%, rgba(255,180,100,0.3) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 2.0s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .lens-bloom.trigger {
      opacity: 1;
    }

    /* 2. CANVASES (KILONOVA & SHARINGAN IRIS) */
    #scene-kilonova, #scene-sharingan {
      background: #000;
    }
    .retina-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. FULLSCREEN NATIVE MESSENGER UI */
    #scene-phone {
      background: #0d0e12;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0;
    }
    .chat-app-bar {
      width: 100%;
      padding: 14px 20px;
      background: #171821;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .user-info h4 {
      margin: 0;
      font-size: 1.05rem;
    }
    .user-info span {
      font-size: 0.8rem;
      color: #00e676;
      font-weight: 500;
    }
    .chat-stream {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .typing-pill {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      height: 18px;
    }
    .msg-bubble {
      max-width: 82%;
      padding: 12px 18px;
      background: #252634;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.98rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .msg-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .voice-bubble {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #1b5e20;
      border-radius: 18px 18px 18px 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(27, 94, 32, 0.45);
      width: 88%;
    }
    .voice-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b5e20;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .waveform {
      display: flex;
      gap: 3.5px;
      align-items: center;
      height: 28px;
      flex: 1;
    }
    .waveform span {
      width: 3.5px;
      height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 4px;
    }
    .playing .waveform span {
      animation: wavePulse 0.45s ease infinite alternate;
    }
    .waveform span:nth-child(2) { animation-delay: 0.08s; }
    .waveform span:nth-child(3) { animation-delay: 0.16s; }
    .waveform span:nth-child(4) { animation-delay: 0.24s; }
    .waveform span:nth-child(5) { animation-delay: 0.32s; }
    .waveform span:nth-child(6) { animation-delay: 0.40s; }
    @keyframes wavePulse {
      from { height: 6px; }
      to { height: 26px; background: #fff; }
    }

    /* 4. GENJUTSU FLASH */
    .genjutsu-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      background: #ff1100;
      transition: opacity 0.1s ease;
    }

    /* 5. PERFECT CENTERED ALARM SCREEN */
    #scene-alarm {
      background: #030303;
      display: none;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 24px;
      width: 100vw;
      height: 100vh;
    }
    #scene-alarm.active {
      display: flex !important;
    }
    .shock-text {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .digital-clock-box {
      width: 85%;
      max-width: 320px;
      background: #0c0c10;
      padding: 28px 20px;
      border-radius: 22px;
      border: 3px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5), inset 0 0 15px rgba(255, 23, 68, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock-time {
      font-family: monospace;
      font-size: clamp(2.5rem, 11vw, 3.8rem);
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.9);
      line-height: 1.1;
    }
    .clock-ampm {
      font-family: monospace;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 800;
      color: #ff1744;
      text-shadow: 0 0 16px rgba(255, 23, 68, 0.9);
      margin-top: 4px;
    }
    .alarm-notice {
      margin-top: 32px;
      font-size: clamp(1.4rem, 6.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      animation: pulseNotice 0.65s ease infinite alternate;
      max-width: 90%;
      line-height: 1.3;
    }
    @keyframes pulseNotice {
      from { transform: scale(1); color: #ff5252; text-shadow: 0 0 12px red; }
      to { transform: scale(1.08); color: #fff; text-shadow: 0 0 35px #ff1744; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: 3D GRAND DOUBLE WOODEN DOORS (🚪🚪) -->
  <div id="scene-door" class="scene active">
    <div class="portal-arch" id="portalFrame">
      <div class="arch-frame"></div>
      <div class="doors-wrapper">
        <div class="door-leaf door-left">
          <div class="wood-panel panel-top"></div>
          <div class="wood-panel panel-bottom"></div>
          <div class="door-knocker"></div>
        </div>
        <div class="door-leaf door-right">
          <div class="wood-panel panel-top"></div>
          <div class="wood-panel panel-bottom"></div>
          <div class="door-knocker"></div>
        </div>
      </div>
    </div>
    <div class="door-btn-wrap">
      <button class="cinematic-btn" id="openDoorBtn" onclick="triggerDoor()">OPEN THE DOORS</button>
    </div>
    <div class="lens-bloom" id="lensBloom"></div>
  </div>

  <!-- SCENE 2: ACCURATE NEUTRON STAR MERGER & KILONOVA -->
  <div id="scene-kilonova" class="scene">
    <canvas id="kilonovaCanvas" class="retina-canvas"></canvas>
  </div>

  <!-- SCENE 3: DIRECT PHONE CHAT UI -->
  <div id="scene-phone" class="scene">
    <div class="chat-app-bar">
      <div class="avatar">J</div>
      <div class="user-info">
        <h4>Jagathish</h4>
        <span id="chatStatus">online</span>
      </div>
    </div>
    <div class="chat-stream" id="chatStream">
      <div class="msg-bubble" id="msg1">Bro where are you?? 💀</div>
      <div class="msg-bubble" id="msg2">Did you forget what day it is today?</div>
      <div class="msg-bubble" id="msg3">Listen to this audio right now! 👇</div>
      <div class="voice-bubble" id="voiceMsg" onclick="playVoiceNote()">
        <div class="play-btn" id="playBtnIcon">▶</div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span style="font-size: 0.88rem; font-weight:700;" id="voiceStatus">0:04</span>
      </div>
      <div class="typing-pill" id="typingStatus"></div>
    </div>
  </div>

  <!-- SCENE 4: PURE SHARINGAN IRIS & TSUKUYOMI VORTEX -->
  <div id="scene-sharingan" class="scene">
    <canvas id="sharinganCanvas" class="retina-canvas"></canvas>
    <div class="genjutsu-overlay" id="genjutsuOverlay"></div>
  </div>

  <!-- SCENE 5: PERFECTLY CENTERED ALARM -->
  <div id="scene-alarm" class="scene">
    <div class="shock-text">* GASP * WAKING UP TO REALITY...</div>
    <div class="digital-clock-box">
      <div class="clock-time">07:45</div>
      <div class="clock-ampm">AM</div>
    </div>
    <div class="alarm-notice">TIME FOR COLLEGE</div>
  </div>

  <script>
    // --- 1. PROCEDURAL CINEMATIC AUDIO SYNTHESIZER ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      playDoubleDoorOpen() {
        this.init();
        const now = this.ctx.currentTime;

        // Double mechanical latches
        for (let offset of [0, 0.04]) {
          const latch = this.ctx.createOscillator();
          const latchGain = this.ctx.createGain();
          latch.type = "square";
          latch.frequency.setValueAtTime(260, now + offset);
          latch.frequency.exponentialRampToValueAtTime(50, now + offset + 0.14);
          latchGain.gain.setValueAtTime(0.32, now + offset);
          latchGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.14);
          latch.connect(latchGain);
          latchGain.connect(this.ctx.destination);
          latch.start(now + offset);
          latch.stop(now + offset + 0.14);
        }

        // Twin oak wood screech
        const creak = this.ctx.createOscillator();
        const creakGain = this.ctx.createGain();
        creak.type = "sawtooth";
        creak.frequency.setValueAtTime(55, now + 0.1);
        creak.frequency.linearRampToValueAtTime(280, now + 1.2);
        creak.frequency.exponentialRampToValueAtTime(75, now + 2.8);
        creakGain.gain.setValueAtTime(0.35, now + 0.1);
        creakGain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
        creak.connect(creakGain);
        creakGain.connect(this.ctx.destination);
        creak.start(now + 0.1);
        creak.stop(now + 2.8);

        // Sub-bass room resonance
        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = "sine";
        sub.frequency.setValueAtTime(95, now + 0.2);
        sub.frequency.exponentialRampToValueAtTime(26, now + 2.4);
        subGain.gain.setValueAtTime(0.55, now + 0.2);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
        sub.connect(subGain);
        subGain.connect(this.ctx.destination);
        sub.start(now + 0.2);
        sub.stop(now + 2.4);
      },

      playKilonovaChirpAndBoom() {
        this.init();
        const now = this.ctx.currentTime;

        // Gravitational wave chirp (rising pitch)
        const chirp = this.ctx.createOscillator();
        const chirpGain = this.ctx.createGain();
        chirp.type = "sawtooth";
        chirp.frequency.setValueAtTime(60, now);
        chirp.frequency.exponentialRampToValueAtTime(1050, now + 2.5);
        chirpGain.gain.setValueAtTime(0.12, now);
        chirpGain.gain.linearRampToValueAtTime(0.42, now + 2.5);
        chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 2.6);
        chirp.connect(chirpGain);
        chirpGain.connect(this.ctx.destination);
        chirp.start(now);
        chirp.stop(now + 2.6);

        // Relativistic Jet Detonation Boom
        setTimeout(() => {
          const jetNow = this.ctx.currentTime;
          const jet = this.ctx.createOscillator();
          const jetGain = this.ctx.createGain();
          jet.type = "sine";
          jet.frequency.setValueAtTime(160, jetNow);
          jet.frequency.exponentialRampToValueAtTime(22, jetNow + 2.5);
          jetGain.gain.setValueAtTime(0.9, jetNow);
          jetGain.gain.exponentialRampToValueAtTime(0.001, jetNow + 2.5);
          jet.connect(jetGain);
          jetGain.connect(this.ctx.destination);
          jet.start(jetNow);
          jet.stop(jetNow + 2.5);
        }, 2500);
      },

      playNotificationChime() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
    };

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // Helper: Retina Canvas Setup
    function setupRetinaCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      return { ctx, dpr, width: window.innerWidth, height: window.innerHeight };
    }

    // --- STEP 1: DOUBLE DOORS OPENING ---
    function triggerDoor() {
      AudioEngine.playDoubleDoorOpen();
      document.getElementById("openDoorBtn").style.display = "none";
      document.getElementById("portalFrame").classList.add("doors-open");

      setTimeout(() => {
        document.getElementById("lensBloom").classList.add("trigger");
      }, 1600);

      setTimeout(() => {
        showScene("scene-kilonova");
        startKilonovaCanvas();
      }, 2900);
    }

    // --- STEP 2: MATHEMATICAL HIGH-FIDELITY KILONOVA (GW170817) ---
    let knAnimId;
    function startKilonovaCanvas() {
      AudioEngine.playKilonovaChirpAndBoom();
      const canvas = document.getElementById("kilonovaCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);

      const cx = width / 2;
      const cy = height / 2;
      let startTime = Date.now();

      // Background Starfield
      const bgStars = [];
      for (let i = 0; i < 350; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.8 + 0.2
        });
      }

      // Active Tidal Plasma Streams
      const tidalPlasma = [];

      function drawNeutronCore(x, y, radius) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 3.6);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.25, "#e0f8ff");
        grad.addColorStop(0.65, "#00c8ff");
        grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;

        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0, 0, 0, 0.26)";
        ctx.fillRect(0, 0, width, height);

        // Draw background stars
        ctx.fillStyle = "#ffffff";
        bgStars.forEach(s => {
          ctx.globalAlpha = s.alpha;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;

        if (elapsed < 2.5) {
          // ==========================================
          // STAGE 1 & 2: INSPIRAL & CYAN TIDAL TAILS
          // ==========================================
          const decay = Math.pow(elapsed / 2.5, 2.4);
          const orbitR = (1 - decay) * (Math.min(width, height) * 0.32);
          const theta = Math.pow(elapsed, 2.6) * 9.5;

          const s1x = cx + Math.cos(theta) * orbitR;
          const s1y = cy + Math.sin(theta) * (orbitR * 0.68);
          const s2x = cx + Math.cos(theta + Math.PI) * orbitR;
          const s2y = cy + Math.sin(theta + Math.PI) * (orbitR * 0.68);

          // Eject Archimedean spiral tidal ribbons
          for (let k = 0; k < 6; k++) {
            const spread = (Math.random() - 0.5) * 12;
            tidalPlasma.push({ x: s1x + spread, y: s1y + spread, alpha: 1.0, color: "#00d5ff" });
            tidalPlasma.push({ x: s2x + spread, y: s2y + spread, alpha: 1.0, color: "#80eeff" });
          }

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (let i = tidalPlasma.length - 1; i >= 0; i--) {
            const p = tidalPlasma[i];
            p.alpha -= 0.038;
            if (p.alpha <= 0) {
              tidalPlasma.splice(i, 1);
              continue;
            }
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4 + (1 - p.alpha) * 18, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          const rCore = Math.max(12, 28 - elapsed * 4);
          drawNeutronCore(s1x, s1y, rCore);
          drawNeutronCore(s2x, s2y, rCore);

        } else if (elapsed >= 2.5 && elapsed < 3.4) {
          // ==========================================
          // STAGE 3: RELATIVISTIC OPPOSING JETS (45 DEG)
          // ==========================================
          const jetT = elapsed - 2.5;
          const jetLength = jetT * (Math.max(width, height) * 1.4);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-Math.PI / 4); // 45-degree angle

          ctx.globalCompositeOperation = "lighter";

          // Expanding synchrotron blue-violet shock ring
          const ringRadius = jetT * 320;
          ctx.strokeStyle = "rgba(80, 160, 255, " + Math.max(0, 0.85 - jetT * 0.7) + ")";
          ctx.lineWidth = 16;
          ctx.beginPath();
          ctx.ellipse(0, 0, ringRadius, ringRadius * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();

          // Opposing relativistic fire plasma columns
          for (let sign of [-1, 1]) {
            const grad = ctx.createLinearGradient(0, 0, 0, sign * jetLength);
            grad.addColorStop(0, "rgba(255, 255, 255, 1)");
            grad.addColorStop(0.25, "rgba(255, 150, 0, 0.9)");
            grad.addColorStop(0.65, "rgba(255, 40, 0, 0.55)");
            grad.addColorStop(1, "rgba(230, 0, 180, 0)");
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-26 - jetT * 22, sign * jetLength);
            ctx.lineTo(26 + jetT * 22, sign * jetLength);
            ctx.closePath();
            ctx.fill();

            // Violet/magenta terminal shockhead lobes
            const lobeY = sign * jetLength;
            const lobeGrad = ctx.createRadialGradient(0, lobeY, 0, 0, lobeY, 60 + jetT * 35);
            lobeGrad.addColorStop(0, "#ffffff");
            lobeGrad.addColorStop(0.35, "#e100ff");
            lobeGrad.addColorStop(0.75, "#7700ff");
            lobeGrad.addColorStop(1, "transparent");
            ctx.fillStyle = lobeGrad;
            ctx.beginPath();
            ctx.arc(0, lobeY, 60 + jetT * 35, 0, Math.PI * 2);
            ctx.fill();
          }

          // Blinding merged core
          const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 75);
          coreGrad.addColorStop(0, "#ffffff");
          coreGrad.addColorStop(0.35, "#a0f0ff");
          coreGrad.addColorStop(0.75, "#0088ff");
          coreGrad.addColorStop(1, "transparent");
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 75, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

        } else {
          // ==========================================
          // STAGE 4: MASSIVE KILONOVA EXPANSION
          // ==========================================
          const expT = elapsed - 3.4;
          const explosionR = expT * (Math.max(width, height) * 1.7) + 85;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          // Expanding cyan plasma cloud
          const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, explosionR);
          cGrad.addColorStop(0, "#ffffff");
          cGrad.addColorStop(0.35, "#b5f5ff");
          cGrad.addColorStop(0.7, "#0099ff");
          cGrad.addColorStop(0.95, "#001144");
          cGrad.addColorStop(1, "transparent");
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, explosionR, 0, Math.PI * 2);
          ctx.fill();

          // Camera whiteout flash
          ctx.fillStyle = "rgba(255, 255, 255, " + Math.min(1, expT * 2.6) + ")";
          ctx.fillRect(0, 0, width, height);
          ctx.restore();
        }

        if (elapsed < 4.2) {
          knAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(knAnimId);
          showScene("scene-phone");
          triggerChatMessages();
        }
      }
      loop();
    }

    // --- STEP 3: PHONE CHAT (CLEAN VIEWPORT) ---
    function triggerChatMessages() {
      const delays = [600, 1900, 3200, 4400];
      const elements = ["msg1", "msg2", "msg3", "voiceMsg"];
      const typing = document.getElementById("typingStatus");
      const chatStatus = document.getElementById("chatStatus");

      elements.forEach((id, index) => {
        setTimeout(() => {
          typing.textContent = "Jagathish is typing...";
          chatStatus.textContent = "typing...";
        }, delays[index] - 450);

        setTimeout(() => {
          typing.textContent = "";
          chatStatus.textContent = "online";
          document.getElementById(id).classList.add("show");
          AudioEngine.playNotificationChime();
        }, delays[index]);
      });
    }

    // --- STEP 4: FRIEND VOICE NOTE (01.mp3) ---
    let voicePlayed = false;
    function playVoiceNote() {
      if (voicePlayed) return;
      voicePlayed = true;

      document.getElementById("playBtnIcon").textContent = "❚❚";
      document.getElementById("voiceMsg").classList.add("playing");
      document.getElementById("voiceStatus").textContent = "Playing...";

      const audio1 = new Audio("01.mp3");
      audio1.play().catch(e => {
        console.log("01.mp3 fallback:", e);
        setTimeout(startDeepSharinganIris, 2000);
      });

      audio1.onended = startDeepSharinganIris;
    }

    // --- STEP 5: PURE SHARINGAN IRIS & TSUKUYOMI VORTEX (02.mp3) ---
    let irisAnimId;
    function startDeepSharinganIris() {
      showScene("scene-sharingan");

      const audio2 = new Audio("02.mp3");
      audio2.play().catch(e => console.log("02.mp3 error:", e));

      const canvas = document.getElementById("sharinganCanvas");
      const { ctx, width, height } = setupRetinaCanvas(canvas);

      const cx = width / 2;
      const cy = height / 2;
      let startTime = Date.now();
      let angle = 0;

      // Floating crimson chakra embers
      const embers = [];
      for (let i = 0; i < 450; i++) {
        embers.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.6 + 0.8,
          speedY: -(Math.random() * 2.2 + 0.6),
          alpha: Math.random() * 0.75 + 0.25
        });
      }

      // Mathematical Itachi Curved Tomoe Blade (Tapered Pinwheel Arc)
      function drawItachiTomoe(rot, scale) {
        ctx.save();
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        // Sweeping outer hook arc
        ctx.bezierCurveTo(
          scale * 0.28, -scale * 0.35,
          scale * 0.68, -scale * 0.72,
          scale * 0.32, -scale * 0.98
        );
        // Tapered return arc curving back to center pupil
        ctx.bezierCurveTo(
          scale * 0.06, -scale * 0.76,
          -scale * 0.18, -scale * 0.35,
          0, 0
        );
        ctx.fillStyle = "#000000";
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        const elapsed = (Date.now() - startTime) / 1000;
        angle += 0.12 + Math.pow(elapsed, 2) * 0.08;

        // 1. Deep Crimson Cosmos Background (Inside the Iris Vortex)
        const maxR = Math.max(width, height) * 0.85;
        const voidGrad = ctx.createRadialGradient(cx, cy, 30, cx, cy, maxR);
        voidGrad.addColorStop(0, "#ff1100");
        voidGrad.addColorStop(0.35, "#aa0000");
        voidGrad.addColorStop(0.7, "#440000");
        voidGrad.addColorStop(1, "#080000");
        ctx.fillStyle = voidGrad;
        ctx.fillRect(0, 0, width, height);

        // 2. High-Density Swirling Iris Micro-Fibrils
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-angle * 0.35);
        ctx.strokeStyle = "rgba(255, 60, 60, 0.22)";
        ctx.lineWidth = 2.2;
        for (let i = 0; i < 48; i++) {
          const a = (i * Math.PI) / 24;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 45, Math.sin(a) * 45);
          ctx.lineTo(Math.cos(a) * maxR, Math.sin(a) * maxR);
          ctx.stroke();
        }

        // Concentric Tomoe Orbit Ring
        ctx.strokeStyle = "rgba(0, 0, 0, 0.45)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(width, height) * 0.34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 3. Floating Blood Chakra Embers
        ctx.fillStyle = "#ff6644";
        embers.forEach(e => {
          e.y += e.speedY;
          if (e.y < 0) e.y = height;
          ctx.globalAlpha = e.alpha;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 4. Central Pure Black Itachi Mangekyo Blades
        const bladeScale = Math.min(width, height) * (0.36 + elapsed * 0.09);

        ctx.save();
        ctx.translate(cx, cy);

        // Intense red chakra aura around the blades
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 65;

        ctx.save();
        ctx.rotate(angle);
        drawItachiTomoe(0, bladeScale);
        drawItachiTomoe((Math.PI * 2) / 3, bladeScale);
        drawItachiTomoe((Math.PI * 4) / 3, bladeScale);
        ctx.restore();

        // Central Pupil Abyss
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, bladeScale * 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Optical Genjutsu Reality Glitch Flash
        if (elapsed > 2.0) {
          document.getElementById("genjutsuOverlay").style.opacity = Math.random() * 0.85;
        }

        if (elapsed < 3.4) {
          irisAnimId = requestAnimationFrame(loop);
        } else {
          cancelAnimationFrame(irisAnimId);
          showScene("scene-alarm");
          triggerWakeUpAlarm();
        }
      }
      loop();
    }

    // --- STEP 6: REALITY WAKEUP & ALARM (03.mp3) ---
    function triggerWakeUpAlarm() {
      const audio3 = new Audio("03.mp3");
      audio3.loop = true;
      audio3.play().catch(e => console.log("03.mp3 error:", e));
    }
  </script>
